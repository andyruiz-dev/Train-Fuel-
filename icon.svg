<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a6fa8"/>
      <stop offset="100%" style="stop-color:#1a7a44"/>
    </linearGradient>
  </defs>
  
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="100" ry="100" fill="url(#bg)"/>
  
  <!-- T&F text -->
  <text x="256" y="200" font-family="Arial Black, sans-serif" font-size="180" 
        font-weight="900" text-anchor="middle" fill="white" opacity="0.95">T</text>
  <text x="256" y="370" font-family="Arial Black, sans-serif" font-size="120" 
        font-weight="900" text-anchor="middle" fill="white" opacity="0.85">&amp;F</text>
  
  <!-- Flame accent -->
  <text x="410" y="140" font-size="100" text-anchor="middle">🔥</text>
</svg>