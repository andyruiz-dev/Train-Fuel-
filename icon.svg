<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1e2a"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="b3" x1="0.4" y1="0" x2="0.6" y2="1">
      <stop offset="0%"   stop-color="#c8e8ff"/>
      <stop offset="35%"  stop-color="#5cb8ff"/>
      <stop offset="75%"  stop-color="#2e90e0"/>
      <stop offset="100%" stop-color="#1060b0"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" rx="100" fill="url(#bg)"/>
  <rect width="200" height="200" rx="100" fill="none" stroke="#2e3347" stroke-width="1.5"/>

  <!-- Left bolt dimmer -->
  <polygon points="84,22  46,98  68,98  60,168  104,82  78,82"
           fill="url(#b3)" opacity="0.40"/>

  <!-- Right bolt bright -->
  <polygon points="118,22  80,98  102,98  94,168  138,82  112,82"
           fill="url(#b3)"/>

  <!-- Right bolt inner highlight -->
  <polygon points="115,34  86,98  100,98  94,152  114,92  100,92"
           fill="white" opacity="0.22"/>

  <!-- T+F centered below -->
  <text x="100" y="188"
        font-family="'Arial Black','Arial',sans-serif"
        font-size="13" font-weight="900"
        fill="#4da6e8" opacity="0.65"
        text-anchor="middle"
        letter-spacing="3">T+F</text>

</svg>
