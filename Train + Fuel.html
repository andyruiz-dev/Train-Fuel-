<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Train &amp; Fuel">
<title>Train &amp; Fuel</title>
<style>
:root{
  --blue:#1a6fa8;--blt:#edf5fb;--bbd:#9fd0ef;
  --green:#1a7a44;--glt:#edfaf3;--gbd:#9fe0c0;
  --orange:#c0580a;--olt:#fef6ee;--obd:#f5c89a;
  --red:#c0392b;--rlt:#fef2f1;--rbd:#f5c6c2;
  --brown:#8B4513;
  --text:#1c1c1e;--muted:#6b6b6b;--bdr:#dde1e5;
  --bg:#f4f6f8;--card:#fff;
  --shadow:0 1px 4px rgba(0,0,0,0.08);
  --nav-h:64px;--hdr-h:52px;
}
body.dark{
  --blue:#4da6e8;--blt:#0d1e2e;--bbd:#1a3a52;
  --green:#3dd68c;--glt:#0a1e14;--gbd:#1a3a28;
  --orange:#f5a623;--olt:#1e1408;--obd:#3a2510;
  --red:#e05c52;--rlt:#2a1010;--rbd:#4a1a18;
  --brown:#c8874a;
  --text:#e8eaf0;--muted:#8a9bb0;--bdr:#252a36;
  --bg:#0f1117;--card:#1a1e28;
  --shadow:0 2px 12px rgba(0,0,0,0.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"Helvetica Neue",sans-serif;max-width:480px;margin:0 auto;
  background:var(--bg);color:var(--text);padding-bottom:0;transition:background .2s,color .2s}
/* ── APP HEADER ── */
.app-hdr{height:var(--hdr-h);background:var(--card);border-bottom:1px solid var(--bdr);
  display:flex;align-items:center;justify-content:space-between;padding:0 16px;
  position:sticky;top:0;z-index:100;box-shadow:var(--shadow)}
.app-hdr-name{font-size:18px;font-weight:800;letter-spacing:-.3px;background:linear-gradient(135deg,var(--blue),var(--green));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.app-hdr-week{font-size:12px;font-weight:700;color:var(--muted);background:var(--blt);
  border-radius:20px;padding:4px 10px;border:1px solid var(--bbd)}
/* ── BOTTOM NAV ── */
.tabs{display:flex;background:var(--card);border-top:1px solid var(--bdr);
  height:var(--nav-h);padding:6px 8px;gap:4px;
  position:sticky;bottom:0;z-index:100;box-shadow:0 -1px 8px rgba(0,0,0,0.08)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:none;background:none;border-radius:12px;padding:6px 4px;cursor:pointer;
  transition:background .15s;color:var(--muted);font-family:inherit}
.tab.act{background:var(--blt);color:var(--blue)}
.ti{font-size:22px;line-height:1;margin-bottom:3px}
.tl{font-size:10px;font-weight:700;letter-spacing:.2px}
/* ── CONTENT AREA ── */
.content{padding:12px;overflow-y:auto;
  height:calc(100vh - var(--hdr-h) - var(--nav-h));
  background:var(--bg)}
/* ── CARDS ── */
.card{background:var(--card);border-radius:14px;border:1px solid var(--bdr);
  padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
/* ── INPUTS ── */
.inp{width:100%;background:var(--bg);border:1.5px solid var(--bdr);border-radius:10px;
  padding:10px 12px;font-size:14px;color:var(--text);font-family:inherit;outline:none;
  transition:border-color .15s}
.inp:focus{border-color:var(--blue)}
select.inp{background:var(--bg)}
.lbl{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;
  letter-spacing:.5px;margin-bottom:5px}
/* ── SET INPUTS ── */
input.sml{width:56px;border:2px solid var(--bdr);border-radius:10px;
  padding:10px 6px;font-size:18px;font-weight:700;text-align:center;
  color:var(--text);background:var(--bg);font-family:inherit;outline:none}
input.sml:focus{border-color:var(--blue)}
input.ti{width:80px;border:1.5px solid var(--bdr);border-radius:8px;
  padding:8px 6px;font-size:12px;text-align:center;
  color:var(--text);background:var(--bg);font-family:inherit;outline:none}
input.ni{border:1.5px solid var(--bdr);border-radius:8px;
  padding:8px 10px;font-size:13px;color:var(--text);background:var(--bg);
  font-family:inherit;outline:none}
/* ── PROGRESS BARS ── */
.pc{background:var(--card);border-radius:12px;padding:10px 12px;
  margin-bottom:10px;border:1px solid var(--bdr);box-shadow:var(--shadow)}
.pr{margin-bottom:8px}.ph{display:flex;justify-content:space-between;
  font-size:11px;margin-bottom:4px;font-weight:600}
.pl{color:var(--muted)}.pv{font-weight:700}
.pb{height:7px;background:var(--bdr);border-radius:4px;overflow:hidden}
.pf{height:100%;border-radius:4px;transition:width .4s}
/* ── FOOD LOG ── */
.fli{background:var(--card);border-radius:10px;padding:10px 12px;
  margin-bottom:8px;border:1px solid var(--bdr);display:flex;
  justify-content:space-between;align-items:center;box-shadow:var(--shadow)}
.fli-m{flex:1}.fli-n{font-size:13px;font-weight:600}.fli-s{font-size:11px;color:var(--muted)}
.fli-c{font-size:13px;font-weight:700;color:var(--blue)}
/* ── BODY WEIGHT INPUTS ── */
.bw-inp{border:1.5px solid var(--bdr);border-radius:8px;padding:6px 4px;
  font-size:13px;text-align:center;background:var(--bg);color:var(--text);
  font-family:inherit;width:100%;outline:none}
/* ── REST TIMER ── */
#rtimer{display:none;position:fixed;bottom:calc(var(--nav-h) + 8px);left:50%;
  transform:translateX(-50%);width:calc(100% - 24px);max-width:456px;
  background:var(--blue);border-radius:16px;padding:10px 14px;z-index:200;
  box-shadow:0 4px 20px rgba(0,0,0,0.3)}
#rtimer.show{display:block}
.rt-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
#rt-name{font-size:11px;color:rgba(255,255,255,.8);font-weight:600}
#rt-cnt{font-size:28px;font-weight:800;color:#fff;letter-spacing:-1px}
.rt-btns{display:flex;gap:6px}
.rt-adj{background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:8px;
  padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
#rt-skip{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);
  color:#fff;border-radius:8px;padding:5px 14px;font-size:12px;font-weight:700;
  cursor:pointer;font-family:inherit}
.rt-bar-wrap{height:4px;background:rgba(255,255,255,.2);border-radius:2px;margin-top:6px}
#rt-bar{height:100%;background:rgba(255,255,255,.9);border-radius:2px;
  transition:width .25s linear}
/* ── OVERLAYS ── */
#manual-overlay,#plate-overlay{display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.5);z-index:300;padding:16px;align-items:flex-end}
#manual-overlay.open,#plate-overlay.open{display:flex}
.overlay-card{background:var(--card);border-radius:20px;padding:18px;
  width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 -4px 30px rgba(0,0,0,.2)}
/* ── FLASH FEEDBACK ── */
@keyframes flash{0%{opacity:1}50%{opacity:.3}100%{opacity:1}}
.flashing{animation:flash .3s ease}
/* ── DARK OVERRIDE FOR SPECIFIC ELEMENTS ── */
body.dark .app-hdr{background:#13161e;border-color:#252a36}
body.dark .tabs{background:#13161e;border-color:#252a36}
body.dark .tab.act{background:rgba(77,166,232,.15);color:var(--blue)}
body.dark input,body.dark select{background:#1a1e28;color:var(--e8eaf0)}
body.dark .overlay-card{background:#1a1e28}
body.dark #rtimer{box-shadow:0 4px 20px rgba(0,0,0,.6)}

<script>
// MIGRATIONS
(function(){if(!localStorage.getItem("tf_migrated_v6")){localStorage.setItem("tf_prog_start","2026-08-10");localStorage.setItem("tf_migrated_v6","1");}})();
(function(){if(!localStorage.getItem("tf_migrated_v9")){localStorage.setItem("tf_prog_start","2026-08-24");localStorage.setItem("tf_migrated_v9","1");}})();
(function(){if(!localStorage.getItem("tf_migrated_v8")){localStorage.setItem("tf_prog_start","2026-08-25");localStorage.setItem("tf_migrated_v8","1");}})();
(function(){if(!localStorage.getItem("tf_migrated_v7")){localStorage.setItem("tf_prog_start","2026-08-17");localStorage.setItem("tf_migrated_v7","1");}})();
(function(){if(!localStorage.getItem("tf_migrated_v4")){localStorage.setItem("tf_cal_target","2000");localStorage.setItem("tf_migrated_v4","1");}})();
(function(){if(!localStorage.getItem("tf_migrated_v5")){if(!localStorage.getItem("tf_measurements")){localStorage.setItem("tf_measurements",JSON.stringify([{date:"2026-08-10",weight:203,chest:"",waist:"",rightArm:"",neck:"",note:"Starting weight"}]));}localStorage.setItem("tf_migrated_v5","1");}})();

// CONSTANTS
var DAY_NAMES=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
var TRAIN_DAYS=[0,2,4],RUCK_DAYS=[1,3,5];
function isTraining(d){return TRAIN_DAYS.indexOf(d)>=0;}
function isRuck(d){return RUCK_DAYS.indexOf(d)>=0;}
var HANDLES=[{k:"Blue",col:"#2980b9",m:"Chest"},{k:"Red",col:"#c0392b",m:"Shoulders"},{k:"Green",col:"#1a7a44",m:"Triceps"}];
function getPhaseLbl(w){
  if(w===0)return"Test Week - Week 1 Progressions";
  var p=prog(w);
  var lbl={1:"Phase 1 - Push Board + DB Rows",2:"Phase 2 - Incline Push-Ups + Ring Rows",3:"Phase 3 - Ring Dips + Pull-Ups"}[p.ph];
  return lbl+(p.deload?" DELOAD WEEK":"");
}

// PROGRESSION
function prog(w){
  var d=w===4||w===8||w===12||w===16||w===20||w===24;
  var b;
  if(w<=4)   b={ph:1,ps:4,pr:"10-12",ds:3,dr:"6-10", rs:4,rr:"10-12",fs:3,fr:"12-15",cs:3,cr:"10-12",hs:3,ht:20,ss:3,sr:"10-12",ks:3,kr:"15"};
  else if(w<=8)  b={ph:1,ps:4,pr:"8-10", ds:3,dr:"8-10", rs:4,rr:"8-10", fs:3,fr:"12-15",cs:3,cr:"8-10", hs:3,ht:25,ss:3,sr:"12-15",ks:3,kr:"20"};
  else if(w<=12) b={ph:1,ps:4,pr:"10-12",ds:3,dr:"10-12",rs:4,rr:"10-12",fs:3,fr:"15",   cs:3,cr:"10-12",hs:3,ht:30,ss:4,sr:"12-15",ks:4,kr:"15"};
  else if(w<=16) b={ph:2,ps:3,pr:"10-12",ds:3,dr:"10-12",rs:3,rr:"8-10", fs:3,fr:"15",   cs:3,cr:"10-12",hs:3,ht:30,ss:4,sr:"15",   ks:4,kr:"20"};
  else if(w<=20) b={ph:2,ps:4,pr:"10-12",ds:3,dr:"12-15",rs:4,rr:"10-12",fs:3,fr:"15",   cs:3,cr:"12-15",hs:3,ht:35,ss:4,sr:"15-20",ks:4,kr:"25"};
  else if(w<=24) b={ph:3,ps:3,pr:"5-6",  ds:3,dr:"12-15",rs:3,rr:"3-5 neg",fs:3,fr:"15", cs:3,cr:"10-12",hs:3,ht:35,ss:5,sr:"15",   ks:4,kr:"20"};
  else if(w===25)b={ph:3,ps:4,pr:"6-8",  ds:3,dr:"15",   rs:4,rr:"5-6",  fs:3,fr:"15",   cs:3,cr:"12-15",hs:3,ht:40,ss:5,sr:"15-20",ks:5,kr:"20"};
  else           b={ph:3,ps:5,pr:"8-10", ds:3,dr:"15",   rs:5,rr:"6-8",  fs:3,fr:"15",   cs:3,cr:"12-15",hs:3,ht:40,ss:5,sr:"15-20",ks:5,kr:"20"};
  if(d){var r=Object.assign({},b);["ps","ds","rs","fs","cs","hs","ss","ks"].forEach(function(k){r[k]=Math.max(2,Math.round(b[k]/2));});r.ht=Math.max(15,Math.round(b.ht*0.6));r.deload=true;return r;}
  b.deload=false;return b;
}

// MACROS
function getStartWeight(){return parseFloat(localStorage.getItem("tf_start_weight"))||203;}
function setStartWeight(w){localStorage.setItem("tf_start_weight",w);markDirty("goals");paint();}
function getGoalWeight(){return parseFloat(localStorage.getItem("tf_goal_weight"))||175;}
function setGoalWeight(w){localStorage.setItem("tf_goal_weight",w);markDirty("goals");paint();}

function getWeekSchedule(w){
  var key="sched_w"+(w||W);
  var stored=localStorage.getItem(key);
  if(stored){try{return JSON.parse(stored);}catch(e){}}
  // Default schedule: Mon/Wed/Fri=Workout, Tue/Thu/Sat=Ruck, Sun=Rest
  return ["workout","ruck","workout","ruck","workout","ruck","rest"];
}
function saveWeekSchedule(sched,w){
  localStorage.setItem("sched_w"+(w||W),JSON.stringify(sched));
}
function getDayType(dayIdx,w){
  return getWeekSchedule(w||W)[dayIdx];
}
function isTrainingDay(d,w){return getDayType(d,w||W)==="workout";}
function isRuckDay(d,w){return getDayType(d,w||W)==="ruck";}

// =========================================================================
// ADAPTIVE PROGRESSION TRACKING
// =========================================================================
function getRepTop(rangeStr){
  // Extract top of rep range e.g. "10-12" -> 12, "15" -> 15, "3-5 neg" -> 5
  var m=rangeStr.match(/(\d+)(?:[^0-9]|$)(?:.*?(\d+))?/);
  if(!m) return 99;
  var nums=rangeStr.match(/\d+/g);
  if(!nums) return 99;
  return parseInt(nums[nums.length-1]);
}

function getSessionData(w, dayIdx){
  // Get stored workout data for a given week/day
  var key="s_w"+w+"_"+["Mon","Tue","Wed","Thu","Fri","Sat","Sun"][dayIdx];
  try{var d=localStorage.getItem(key);return d?JSON.parse(d):null;}catch(e){return null;}
}

function getTrainingDaysForWeek(w){
  // Get the indices of training days for a given week
  var sched=getWeekSchedule(w);
  var days=[];
  for(var i=0;i<7;i++){if(sched[i]==="workout")days.push(i);}
  return days;
}

function checkProgression(exKey, repRange, numSets, lookbackWeeks){
  // Returns {ready:bool, sessions:int} 
  // Checks last 2 training sessions where this exercise was logged
  var top=getRepTop(repRange);
  var sessions=[];
  var weeksToCheck=lookbackWeeks||4;

  for(var w=W;w>=Math.max(1,W-weeksToCheck);w--){
    var trainDays=getTrainingDaysForWeek(w);
    for(var di=trainDays.length-1;di>=0;di--){
      var data=getSessionData(w,trainDays[di]);
      if(!data) continue;
      // Check all sets for this exercise
      var allHit=true;
      var anyLogged=false;
      for(var s=1;s<=numSets;s++){
        // Try different key patterns
        var val=null;
        if(data[exKey]&&data[exKey]["s"+s]) val=parseInt(data[exKey]["s"+s]);
        else {
          // Try flat key
          var flatKey=exKey+".s"+s;
          var parts=flatKey.split(".");
          var cur=data;
          for(var p=0;p<parts.length;p++){if(!cur)break;cur=cur[parts[p]];}
          if(cur) val=parseInt(cur);
        }
        if(val>0) anyLogged=true;
        if(!val||val<top) allHit=false;
      }
      if(anyLogged) sessions.push(allHit);
      if(sessions.length>=2) break;
    }
    if(sessions.length>=2) break;
  }
  var consecutive=sessions.length>=2&&sessions[0]&&sessions[1];
  return{ready:consecutive,sessions:sessions.length,hitTop:sessions[0]||false};
}

function getProgressionStatus(){
  var p=prog(W===0?1:W);
  var results={};

  // Pull/Rows
  var pullCheck=checkProgression("pull",p.rr,p.rs);
  results.pull={label:"DB Rows",action:"+2.5 lb next session",ready:pullCheck.ready,hit:pullCheck.hitTop};

  // Curls
  var curlCheck=checkProgression("curl",p.cr,p.cs);
  results.curl={label:"DB Curls",action:"+2.5 lb next session",ready:curlCheck.ready,hit:curlCheck.hitTop};

  // KB Swings
  var kbCheck=checkProgression("kb",p.kr,p.ks);
  results.kb={label:"KB Swings",action:"Move to heavier kettlebell",ready:kbCheck.ready,hit:kbCheck.hitTop};

  // Split Squats
  var ssCheck=checkProgression("ss",p.sr,p.ss);
  results.ss={label:"Split Squats",action:"Add weight (hold DB or wear vest)",ready:ssCheck.ready,hit:ssCheck.hitTop};

  // Push Board
  var pushCheck=checkProgression("push",p.pr,p.ps);
  results.push={label:"Push Board",action:p.ph===1?"Next handle color":p.ph===2?"Lower incline":"Progress to next variation",ready:pushCheck.ready,hit:pushCheck.hitTop};

  // Decline Push-Ups
  var decCheck=checkProgression("dec",p.dr,p.ds);
  results.dec={label:"Decline Push-Ups",action:"Add 1 stair step",ready:decCheck.ready,hit:decCheck.hitTop};

  // Face Pulls
  var fpCheck=checkProgression("fp",p.fr,p.fs);
  results.fp={label:"Ring Face Pulls",action:"Lower ring attachment point",ready:fpCheck.ready,hit:fpCheck.hitTop};

  // Hollow Body
  var hbCheck=checkProgression("hb",p.ht+"",p.hs);
  results.hb={label:"Hollow Body Hold",action:"Add 5 seconds per set",ready:hbCheck.ready,hit:hbCheck.hitTop};

  return results;
}

// REST TIMER — recursive setTimeout, wall-clock based
var RT_END=0,RT_TOT=0,RT_REM=0,RT_IV=null;
function startRest(secs,name){
  if(RT_IV){clearTimeout(RT_IV);RT_IV=null;}
  RT_TOT=secs;RT_REM=secs;RT_END=Date.now()+(secs*1000);
  var el=document.getElementById("rt-name");if(el)el.textContent=name;
  var cnt=document.getElementById("rt-cnt");if(cnt)cnt.style.color="#fff";
  var bar=document.getElementById("rt-bar");if(bar){bar.style.background="#fff";bar.style.opacity="0.7";}
  var tmr=document.getElementById("rtimer");if(tmr)tmr.classList.add("show");
  tickTimer();
}
function playBeeps(){
  try{
    var ctx=new(window.AudioContext||window.webkitAudioContext)();
    function beep(startTime,freq,dur,vol){
      var osc=ctx.createOscillator();
      var gain=ctx.createGain();
      osc.connect(gain);gain.connect(ctx.destination);
      osc.frequency.value=freq;
      osc.type="sine";
      gain.gain.setValueAtTime(0,startTime);
      gain.gain.linearRampToValueAtTime(vol||0.4,startTime+0.01);
      gain.gain.linearRampToValueAtTime(0,startTime+dur);
      osc.start(startTime);
      osc.stop(startTime+dur+0.05);
    }
    var t=ctx.currentTime;
    beep(t,880,0.12,0.3);      // beep 1
    beep(t+0.18,880,0.12,0.3); // beep 2
    beep(t+0.36,1320,0.5,0.5); // final bell
  }catch(e){}
}
function tickTimer(){
  RT_REM=Math.max(0,Math.ceil((RT_END-Date.now())/1000));
  var m=Math.floor(RT_REM/60),s=RT_REM%60;
  var cnt=document.getElementById("rt-cnt");
  var bar=document.getElementById("rt-bar");
  if(cnt)cnt.textContent=m+":"+(s<10?"0":"")+s;
  if(bar)bar.style.width=(RT_TOT>0?(RT_REM/RT_TOT*100):0)+"%";
  if(RT_REM>0){
    RT_IV=setTimeout(tickTimer,250);
  } else {
    RT_IV=null;
    if(bar){bar.style.background="rgba(255,255,255,.9)";bar.style.opacity="1";}
    if(cnt)cnt.textContent="Go!";
    playBeeps();
  }
}
function stopRest(){if(RT_IV){clearTimeout(RT_IV);RT_IV=null;}RT_END=0;var t=document.getElementById("rtimer");if(t)t.classList.remove("show");}
function addTime(s){RT_END+=s*1000;RT_REM=Math.max(0,Math.ceil((RT_END-Date.now())/1000));RT_TOT=Math.max(RT_TOT,RT_REM);}

function bWeeklySummary(){
  var BWD=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  var sched=getWeekSchedule(W);
  var workoutDays=[],ruckDays=[];
  for(var d=0;d<7;d++){if(sched[d]==="workout")workoutDays.push(d);if(sched[d]==="ruck")ruckDays.push(d);}
  var workoutsDone=0,rucksDone=0;
  workoutDays.forEach(function(d){var data=getSessionData(W,d);if(data&&Object.keys(data).length>0)workoutsDone++;});
  ruckDays.forEach(function(d){var data=getSessionData(W,d);if(data&&data.ruck&&data.ruck.done==="done")rucksDone++;});
  var bwRaw=localStorage.getItem("bw_w"+W);
  var bwObj=bwRaw?JSON.parse(bwRaw):{};
  var bwVals=BWD.map(function(d){return parseFloat(bwObj[d]);}).filter(function(v){return!isNaN(v)&&v>0;});
  var bwAvg=bwVals.length?Math.round(bwVals.reduce(function(a,b){return a+b;},0)/bwVals.length*10)/10:null;
  var calTotal=0,calDays=0;
  for(var d=0;d<7;d++){var dt=getDateForDay(W,d);var lg=null;try{lg=JSON.parse(localStorage.getItem("food_"+dt)||"null");}catch(e){}if(lg&&lg.length){calTotal+=foodTot(lg).cal;calDays++;}}
  var calAvg=calDays>0?Math.round(calTotal/calDays):null;
  var wOk=workoutsDone===workoutDays.length;
  var rOk=rucksDone===ruckDays.length;
  var perfect=wOk&&rOk;
  var good=workoutsDone>=workoutDays.length-1&&rucksDone>=ruckDays.length-1;
  var grade=perfect?"&#127942; Perfect week!":good?"&#128079; Solid week":"&#128165; Keep pushing";
  var gradCol=perfect?"var(--green)":good?"var(--blue)":"var(--orange)";
  return "<div style=\"background:#fff;border-radius:12px;border:1px solid var(--bdr);margin-bottom:10px;overflow:hidden\">"
    +"<div style=\"background:var(--blue);padding:10px 13px;display:flex;align-items:center;gap:8px\">"

    +"<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--bdr)\">"
    +"<div style=\"background:#fff;padding:14px;text-align:center\"><div style=\"font-size:24px;font-weight:700;color:"+(wOk?"var(--green)":"var(--orange)")+"\">"+workoutsDone+"/"+workoutDays.length+"</div><div style=\"font-size:11px;color:var(--muted)\">WORKOUTS</div></div>"
    +"<div style=\"background:#fff;padding:14px;text-align:center\"><div style=\"font-size:24px;font-weight:700;color:"+(rOk?"var(--green)":"var(--orange)")+"\">"+rucksDone+"/"+ruckDays.length+"</div><div style=\"font-size:11px;color:var(--muted)\">RUCKS</div></div>"
    +(bwAvg?"<div style=\"background:#fff;padding:14px;text-align:center;border-top:1px solid var(--bdr)\"><div style=\"font-size:24px;font-weight:700\">"+bwAvg+"</div><div style=\"font-size:11px;color:var(--muted)\">AVG WEIGHT (lb)</div></div>":"")
    +(calAvg?"<div style=\"background:#fff;padding:14px;text-align:center;border-top:1px solid var(--bdr)\"><div style=\"font-size:24px;font-weight:700;color:"+(Math.abs(calAvg-getCalTarget())<150?"var(--green)":"var(--orange)")+"\">"+calAvg+"</div><div style=\"font-size:11px;color:var(--muted)\">AVG CALORIES</div></div>":"")

// MACRO RING SVG
function macroRing(pro,carb,fat,proT,carbT,fatT,calT,calLogged){
  var PI2=2*Math.PI;
  var R=44,cx=60,cy=60,sw=14;
  var circ=PI2*R;
  // Segment fractions — how much of each target consumed
  var pFrac=proT>0?Math.min(1,pro/proT):0;
  var cFrac=carbT>0?Math.min(1,carb/carbT):0;
  var fFrac=fatT>0?Math.min(1,fat/fatT):0;
  // Each segment occupies 1/3 of the ring (by calorie target weight)
  var proSlice=circ/3,carbSlice=circ/3,fatSlice=circ/3;
  // Calculate remaining calories
  var calRem=Math.max(0,calT-calLogged);
  var pct=calT>0?Math.round(calLogged/calT*100):0;
  // Arc helper
  function arc(frac,offset,color,slice){
    var len=Math.max(0,frac*slice);
    var gap=circ-len;
    var dasharray=len+" "+gap;
    var dashoffset=-(offset);
    return"<circle cx=\""+cx+"\" cy=\""+cy+"\" r=\""+R+"\" fill=\"none\" stroke=\""+color+"\" stroke-width=\""+sw+"\" stroke-dasharray=\""+dasharray+"\" stroke-dashoffset=\""+dashoffset+"\" stroke-linecap=\"round\"/>";
  }
  // Background ring
  var bg="<circle cx=\""+cx+"\" cy=\""+cy+"\" r=\""+R+"\" fill=\"none\" stroke=\"#f0f0f0\" stroke-width=\""+sw+"\"/>";
  // Three segments: protein (blue), carbs (orange), fat (green)
  // Each occupies 1/3 of ring, starting at top (-90deg = -circ/4 offset)
  var startOffset=circ*0.25; // start at top
  var proArc=arc(pFrac,startOffset,"#1a6fa8",proSlice);
  var carbArc=arc(cFrac,startOffset-proSlice,"#e67e22",carbSlice);
  var fatArc=arc(fFrac,startOffset-proSlice-carbSlice,"#27ae60",fatSlice);
  return"<div style=\"display:flex;align-items:center;gap:12px;padding:10px 0\">"
    +"<svg viewBox=\"0 0 120 120\" width=\"90\" height=\"90\" style=\"flex-shrink:0\">"+bg+proArc+carbArc+fatArc
    +"<text x=\"60\" y=\"56\" text-anchor=\"middle\" style=\"font-size:17px;font-weight:700;fill:#222\">"+calRem+"</text>"
    +"<text x=\"60\" y=\"70\" text-anchor=\"middle\" style=\"font-size:9px;fill:#999\">cal left</text>"
    +"</svg>"
    +"<div style=\"flex:1\">"
    +"<div style=\"display:flex;align-items:center;gap:5px;margin-bottom:4px\"><div style=\"width:10px;height:10px;border-radius:50%;background:#1a6fa8;flex-shrink:0\"></div><span style=\"font-size:11px\">Protein <b>"+Math.round(pro)+"</b>/"+proT+"g</span></div>"
    +"<div style=\"display:flex;align-items:center;gap:5px;margin-bottom:4px\"><div style=\"width:10px;height:10px;border-radius:50%;background:#e67e22;flex-shrink:0\"></div><span style=\"font-size:11px\">Carbs <b>"+Math.round(carb)+"</b>/"+carbT+"g</span></div>"
    +"<div style=\"display:flex;align-items:center;gap:5px\"><div style=\"width:10px;height:10px;border-radius:50%;background:#27ae60;flex-shrink:0\"></div><span style=\"font-size:11px\">Fat <b>"+Math.round(fat)+"</b>/"+fatT+"g</span></div>"
    +"</div></div>";
}

// PROGRESS CHART
function weightChart(){
  var weeks=[];
  for(var w=1;w<=W;w++){
    var bwRaw=localStorage.getItem("bw_w"+w);
    if(!bwRaw) continue;
    try{
      var obj=JSON.parse(bwRaw);
      var vals=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(function(d){return parseFloat(obj[d]);}).filter(function(v){return!isNaN(v)&&v>0;});
      if(vals.length>0){
        var avg=Math.round(vals.reduce(function(a,b){return a+b;},0)/vals.length*10)/10;
        weeks.push({w:w,avg:avg});
      }
    }catch(e){}
  }
  if(weeks.length<2) return"<div style=\"background:#fff;border-radius:12px;border:1px solid var(--bdr);padding:14px 13px;margin-bottom:10px;text-align:center;color:var(--muted);font-size:12px\">Log weight for 2+ weeks to see your trend chart</div>";
  // SVG dimensions
  var svgW=300,svgH=120,padL=34,padR=10,padT=10,padB=20;
  var chartW=svgW-padL-padR,chartH=svgH-padT-padB;
  var vals=weeks.map(function(w){return w.avg;});
  var minV=Math.min.apply(null,vals)-2,maxV=Math.max.apply(null,vals)+2;
  var goal=getGoalWeight();
  var xScale=function(i){return padL+i*(chartW/(weeks.length-1));};
  var yScale=function(v){return padT+chartH-(v-minV)/(maxV-minV)*chartH;};
  // Build path
  var points=weeks.map(function(wk,i){return xScale(i)+","+yScale(wk.avg);});
  var path="M"+points.join(" L");
  // Goal line y
  var goalY=yScale(Math.max(minV,Math.min(maxV,goal)));
  // Start weight line
  var startW=getStartWeight();
  var startY=yScale(Math.max(minV,Math.min(maxV,startW)));
  var svg="<svg viewBox=\"0 0 "+svgW+" "+svgH+"\" style=\"width:100%;height:auto\">"
    // Grid lines
    +"<line x1=\""+padL+"\" y1=\""+padT+"\" x2=\""+padL+"\" y2=\""+padT+chartH+"\" stroke=\"#eee\" stroke-width=\"1\"/>"
    // Goal line (dashed)
    +(goal>minV&&goal<maxV?"<line x1=\""+padL+"\" y1=\""+goalY+"\" x2=\""+(svgW-padR)+"\" y2=\""+goalY+"\" stroke=\"var(--green)\" stroke-width=\"1.5\" stroke-dasharray=\"4,3\"/><text x=\""+padL+"\" y=\""+Math.max(padT+8,goalY-3)+"\" style=\"font-size:8px;fill:var(--green)\">Goal</text>":"")
    // Weight line
    +"<path d=\""+path+"\" fill=\"none\" stroke=\"var(--blue)\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>"
    // Data points
    +weeks.map(function(wk,i){
      return"<circle cx=\""+xScale(i)+"\" cy=\""+yScale(wk.avg)+"\" r=\"3.5\" fill=\"var(--blue)\"/>";
    }).join("")
    // X labels (every other week for readability)
    +weeks.map(function(wk,i){
      if(i===0||i===weeks.length-1||(weeks.length>6&&i%2!==0)) return"";
      return"<text x=\""+xScale(i)+"\" y=\""+(svgH-4)+"\" text-anchor=\"middle\" style=\"font-size:7px;fill:#999\">W"+wk.w+"</text>";
    }).join("")
    // First and last X labels
    +"<text x=\""+xScale(0)+"\" y=\""+(svgH-4)+"\" text-anchor=\"middle\" style=\"font-size:7px;fill:#999\">W"+weeks[0].w+"</text>"
    +"<text x=\""+xScale(weeks.length-1)+"\" y=\""+(svgH-4)+"\" text-anchor=\"middle\" style=\"font-size:7px;fill:#999\">W"+weeks[weeks.length-1].w+"</text>"
    // Y axis labels (first and last value)
    +"<text x=\""+(padL-2)+"\" y=\""+(padT+4)+"\" text-anchor=\"end\" style=\"font-size:8px;fill:#999\">"+Math.round(maxV)+"</text>"
    +"<text x=\""+(padL-2)+"\" y=\""+(padT+chartH)+"\" text-anchor=\"end\" style=\"font-size:8px;fill:#999\">"+Math.round(minV)+"</text>"
    +"</svg>";
  var firstW=weeks[0].avg,lastW=weeks[weeks.length-1].avg;
  var diff=Math.round((firstW-lastW)*10)/10;
  return"<div style=\"background:#fff;border-radius:12px;border:1px solid var(--bdr);padding:12px 13px;margin-bottom:10px\">"
    +"<div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:8px\">"
    +"<div style=\"font-size:13px;font-weight:700\">Weight Trend</div>"
    +(diff>0?"<div style=\"font-size:12px;color:var(--green);font-weight:700\">-"+diff+" lb lost</div>":diff<0?"<div style=\"font-size:12px;color:var(--orange);font-weight:700\">+"+Math.abs(diff)+" lb</div>":"<div style=\"font-size:12px;color:var(--muted)\">Tracking...</div>")
    +"</div>"
    +svg
    +"</div>";
}

// PROGRESS TAB
function getWeekVolume(w){
  var sched=getWeekSchedule(w);
  var total=0;
  var EX_KEYS=["push","pull","dec","curl","fp","hb","ss","kb"];
  for(var d=0;d<7;d++){
    if(sched[d]!=="workout") continue;
    var data=getSessionData(w,d);
    if(!data) continue;
    EX_KEYS.forEach(function(k){
      var ex=data[k];
      if(!ex) return;
      for(var s=1;s<=6;s++){if(ex["s"+s]&&parseInt(ex["s"+s])>0)total++;}
    });
  }
  return total;
}
function getWeekRuckPace(w){
  var sched=getWeekSchedule(w);
  var paces=[];
  for(var d=0;d<7;d++){
    if(sched[d]!=="ruck") continue;
    var data=getSessionData(w,d);
    if(!data||!data.ruck) continue;
    var dist=parseFloat(data.ruck.dist);
    var tm=data.ruck.time;
    if(!dist||!tm) continue;
    var parts=tm.split(":");
    var mins=parts.length===2?parseInt(parts[0])+parseInt(parts[1])/60:parseInt(parts[0]);
    if(dist>0&&mins>0) paces.push(Math.round(mins/dist*10)/10);
  }
  return paces.length?Math.round(paces.reduce(function(a,b){return a+b;},0)/paces.length*10)/10:null;
}
function svgBarChart(data,color,yLabel,formatVal){
  if(!data.length) return"";
  var svgW=300,svgH=100,padL=30,padR=8,padT=8,padB=18;
  var chartW=svgW-padL-padR,chartH=svgH-padT-padB;
  var vals=data.map(function(d){return d.val;});
  var maxV=Math.max.apply(null,vals)||1;
  var barW=Math.max(4,Math.floor(chartW/data.length)-2);
  var bars=data.map(function(d,i){
    var x=padL+i*(chartW/data.length)+1;
    var h=Math.max(2,d.val/maxV*chartH);
    var y=padT+chartH-h;
    return"<rect x=\""+x+"\" y=\""+y+"\" width=\""+barW+"\" height=\""+h+"\" rx=\"2\" fill=\""+color+"\" opacity=\""+(d.val>0?1:0.15)+"\"\/>"
      +(i===0||i===data.length-1?"<text x=\""+(x+barW/2)+"\" y=\""+(svgH-4)+"\" text-anchor=\"middle\" style=\"font-size:7px;fill:#999\">W"+d.w+"</text>":"");
  }).join("");
  return"<svg viewBox=\"0 0 "+svgW+" "+svgH+"\" style=\"width:100%;height:auto\">"
    +"<text x=\""+(padL-2)+"\" y=\""+(padT+4)+"\" text-anchor=\"end\" style=\"font-size:8px;fill:#999\">"+formatVal(maxV)+"</text>"
    +bars
    +"</svg>";
}

function bProgress(){
  var h="";
  var BWD=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];

  // ── Streak + start/goal (moved from Goals) ──────────────────────────
  function calcStreak2(){
    var streak=0;
    for(var w=W-1;w>=1;w--){
      var sched2=getWeekSchedule(w);
      var wD=[],rD=[];
      for(var d=0;d<7;d++){if(sched2[d]==="workout")wD.push(d);if(sched2[d]==="ruck")rD.push(d);}
      var wDone=0,rDone=0;
      wD.forEach(function(d){var data=getSessionData(w,d);if(data&&Object.keys(data).length>0)wDone++;});
      rD.forEach(function(d){var data=getSessionData(w,d);if(data&&data.ruck&&data.ruck.done==="done")rDone++;});
      if(wDone>=2&&rDone>=2) streak++; else break;
    }
    return streak;
  }
  var streak=calcStreak2();
  var streakCol=streak===0?"var(--muted)":streak<4?"var(--blue)":streak<8?"var(--orange)":"var(--green)";
  var streakMsg=streak===0?"Start your streak this week!":streak===1?"1 week strong!":streak+" weeks in a row!";

  h+="<div style=\"background:#fff;border-radius:12px;border:1px solid var(--bdr);margin-bottom:10px;overflow:hidden\">"
    +"<div style=\"background:"+streakCol+";padding:9px 13px;display:flex;align-items:center;justify-content:space-between\">"
    +"<div style=\"display:flex;align-items:center;gap:8px\"><span style=\"font-size:20px\">"+(streak===0?"&#127919;":streak<4?"&#128293;":"&#127942;")+"</span>"
    +"<span style=\"font-size:14px;font-weight:700;color:#fff\">"+streakMsg+"</span></div>"
    +(streak>0?"<span style=\"font-size:24px;font-weight:700;color:#fff\">"+streak+"</span>":"")
    +"</div></div>";

  // ── Program overview ─────────────────────────────────────────────────

// MEAL SUGGESTION GENERATOR
function generateMealSuggestion(){
  var log=getLog();
  var tot=foodTot(log);
  var m=getMacroTargets();
  var remCal=Math.max(0,Math.round(m.cal-tot.cal));
  var remPro=Math.max(0,Math.round(m.pro-tot.pro));
  var remCarb=Math.max(0,Math.round(m.carb-tot.carb));
  var remFat=Math.max(0,Math.round(m.fat-tot.fat));

  // Time of day
  var hr=new Date().getHours();
  var mealTime=hr<10?"breakfast":hr<14?"lunch":hr<17?"afternoon snack":hr<20?"dinner":"evening snack";

  // Day type context
  var dayType=getDayType(DAY,W);
  var dayCtx=dayType==="workout"?"This is a workout day — slightly higher carbs are appropriate."
    :dayType==="ruck"?"This is a ruck day — moderate carbs, prioritize protein."
    :"This is a rest day — keep carbs a little lower, prioritize protein and fat.";

  // Already logged today
  var loggedItems=log.length>0?"Already logged today: "+log.map(function(i){return i.name+" ("+i.cal+"cal)";}).join(", ")+".\n":"Nothing logged yet today.\n";

    var prompt="You are a nutrition coach. Suggest 2-3 specific meal ideas for right now based on this context:\n\n"
    +"Time: "+mealTime+"\n"
    +"Day type: "+dayCtx+"\n"
    +"Daily targets: "+m.cal+" cal / "+m.pro+"g protein / "+m.carb+"g carbs / "+m.fat+"g fat\n"
    +loggedItems
    +"Remaining today: ~"+remCal+" cal / "+remPro+"g protein / "+remCarb+"g carbs / "+remFat+"g fat\n\n"
    +"Guidelines:\n"
    +"- Use the Precision Nutrition hand portion system: palms of protein, cupped hands of carbs, fists of veggies, thumbs of fat\n"
    +"- Meals should be practical and quick to make (under 15 minutes)\n"
    +"- Prioritize whole foods: chicken, eggs, rice, vegetables, Greek yogurt\n"
    +"- For each suggestion include: meal name, key ingredients with hand portions, approximate macros\n"
    +"- Keep suggestions realistic for someone who eats simply and consistently\n"
    +"- If remaining calories are low (<300), suggest a snack instead\n"
    +"- Format clearly with meal name as header, then portions, then macros on one line";

  if(!getApiKey()){MEAL_STATE="error";markDirty("food");paint();return;}
  fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:apiHeaders(),
    body:JSON.stringify({
      model:"claude-sonnet-4-6",
      max_tokens:800,
      messages:[{role:"user",content:prompt}]
    })
  })
  .then(function(r){return r.json();})
  .then(function(data){
    if(data&&data.content&&data.content[0]&&data.content[0].text){
      MEAL_RESULT=data.content[0].text;
      MEAL_STATE="result";
    } else {
      MEAL_STATE="error";
    }
    markDirty("food"); paint();
  })
  .catch(function(){
    MEAL_STATE="error"; markDirty("food"); paint();
  });
}

// AI WORKOUT GENERATOR
function generateAIWorkout(){
  var p=prog(W===0?1:W);
  var phaseMap={1:"Phase 1 - Push Board and 1-Arm DB Rows",2:"Phase 2 - Incline Push-Ups and Ring Rows",3:"Phase 3 - Ring Dips and Pull-Ups"};
  var AI_TRAVEL_CTX=AI_TRAVEL?" The person is in a hotel room with no equipment. Bodyweight only, small space.":"";
  var AI_RECOV_CTX=AI_RECOVERY?" Active recovery session needed. Low intensity, mobility and movement focus.":"";
  var soreParts=[];for(var di=0;di<7;di++){try{var sp=JSON.parse(localStorage.getItem("sore_w"+W+"_d"+di)||"[]");if(sp.length)soreParts=soreParts.concat(sp);}catch(e){}}
  var soreUniq=soreParts.filter(function(v,i,a){return a.indexOf(v)===i;});
  var AI_SORE_CTX=soreUniq.length>0?" Currently sore areas: "+soreUniq.join(", ")+". Avoid these areas.":"";
  var prompt="You are a personal trainer. Generate a complete workout for the following context:\n\n"
    +"Program: 26-week body recomposition for a 46-year-old male, 6ft, targeting fat loss and muscle building\n"
    +"Current week: "+W+" of 26\n"
    +"Current phase: "+phaseMap[p.ph]+"\n"
    +"Deload week: "+(p.deload?"Yes - use reduced volume":"No")+"\n"
    +"Available equipment: "+AI_EQUIPMENT.join(", ")+"\n"
    +"Intensity: "+AI_INTENSITY+"\n\n"
    +"Regular program supersets for context:\n"
    +"- Superset A: Push Board/Incline/Ring Dips + DB Rows ("+p.ps+" rounds x "+p.pr+" reps)\n"
    +"- Superset B: Decline Push-Ups + DB Curls ("+p.ds+" x "+p.dr+")\n"
    +"- Superset C: Ring Face Pulls + Hollow Body Hold ("+p.fs+" x "+p.fr+")\n"
    +"- Superset D: Bulgarian Split Squats + KB Swings ("+p.ss+" x "+p.sr+" / "+p.ks+" x "+p.kr+")\n\n"
    +"Generate a complete alternative workout using ONLY the available equipment listed. "
    +"Format it clearly with superset labels, exercise names, sets x reps, and rest times. "
    +"Match the "+AI_INTENSITY+" intensity. Target exactly "+AI_DURATION+" minutes — no more, no less. Scale sets, reps, and rest periods to fit precisely. "
    +"Include brief form cues for each exercise. Do not include any equipment not listed as available."
    +AI_TRAVEL_CTX+AI_RECOV_CTX+AI_SORE_CTX;

  if(!getApiKey()){AI_STATE="nokey";markDirty("ai");paint();return;}
  fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:apiHeaders(),
    body:JSON.stringify({
      model:"claude-sonnet-4-6",
      max_tokens:1000,
      messages:[{role:"user",content:prompt}]
    })
  })
  .then(function(r){return r.json();})
  .then(function(data){
    if(data&&data.content&&data.content[0]&&data.content[0].text){
      AI_RESULT=data.content[0].text;
      AI_STATE="result";
    } else if(data&&data.error){
      AI_STATE="error";AI_ERROR=data.error.message||"API error";
    } else {
      AI_STATE="error";AI_ERROR="";
    }
    markDirty("ai");paint();
  })
  .catch(function(e){
    AI_STATE="error";AI_ERROR="Network error - check connection";markDirty("ai");paint();
  });
}

  if(t.classList&&t.classList.contains("ni")&&t.dataset.key){ss(t.dataset.key,t.value);}
  // Catch-all: any input with data-key not handled above
  if(t.dataset&&t.dataset.key&&!t.classList.contains("bw-inp")){ss(t.dataset.key,t.value);}
  if(t.classList&&t.classList.contains("bw-inp")&&t.dataset.day){var o=lg("bw_w"+W)||{};o[t.dataset.day]=parseFloat(t.value)||null;ls("bw_w"+W,o);flash();}
});

document.addEventListener("change",function(e){
  var t=e.target;
  if(t.tagName==="SELECT"&&t.dataset.key){ss(t.dataset.key,t.value);markDirty("workout");paint();return;}
  if(t.classList&&t.classList.contains("ni")&&t.dataset.key){ss(t.dataset.key,t.value);}
  if(t.classList&&t.classList.contains("ti")&&t.dataset.key){ss(t.dataset.key,t.value);}
});

// Save active text field when app goes to background or field loses focus
function saveActiveField(){
  var a=document.activeElement;
  if(a&&a.dataset&&a.dataset.key){
    if(a.classList&&(a.classList.contains("ni")||a.classList.contains("ti"))){
      ss(a.dataset.key,a.value);
    }
  }
}
document.addEventListener("visibilitychange",function(){if(document.hidden)saveActiveField();});
document.addEventListener("blur",function(){saveActiveField();},true);
