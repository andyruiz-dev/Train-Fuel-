<style>
:root{
  --blue:#4da6e8;   --blt:#0d1e2e;  --bbd:#1a3a52;
  --green:#3dd68c;  --glt:#0a1e14;  --gbd:#1a3a28;
  --orange:#f5a623; --olt:#1e1408;  --obd:#3a2510;
  --teal:#2dd4bf;   --tlt:#0a1e1c;
  --red:#e05c52;    --rlt:#2a1010;
  --purple:#a855f7;
  --text:#e8eaf0;   --muted:#8a9bb0;
  --bdr:#2e3347;    --bg:#1a1e2a;   --card:#22273a;
  --shadow:0 2px 8px rgba(0,0,0,0.35);
}
body.dark{
  --blue:#4da6e8;--blt:#0d1e2e;--green:#3dd68c;--glt:#0a1e14;
  --orange:#f5a623;--olt:#1e1408;--red:#e05c52;--rlt:#2a1010;
  --text:#e8eaf0;--muted:#8a9bb0;--bdr:#2a3040;--bg:#0f1117;--card:#1a1e28;
  --shadow:0 2px 12px rgba(0,0,0,0.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button{cursor:pointer;font-family:inherit;border:none;background:none}
input,select{font-family:inherit}
body{background:var(--bg);font-family:-apple-system,"Helvetica Neue",sans-serif;max-width:480px;margin:0 auto;padding-bottom:20px;color:var(--text)}
.app-hdr{background:var(--card);border-bottom:1px solid var(--bdr);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 1px 4px rgba(0,0,0,0.06)}
body.dark .app-hdr{background:#13161e;border-color:#252a36}
.app-hdr-name{font-size:17px;font-weight:800;background:linear-gradient(135deg,#4da6e8,#3dd68c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.app-hdr-week{font-size:12px;font-weight:700;color:#4da6e8;background:#0d1e2e;border-radius:20px;padding:3px 10px;border:1px solid #1a3a52}
.hdr{background:var(--card);border-bottom:1px solid var(--bdr);padding:8px 10px 0}
body.dark .hdr{background:#13161e;border-color:#252a36}
.hdr-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.wk-lbl{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;text-align:center}
.wk-nav{display:flex;align-items:center;gap:8px}
.wk-btn{background:#0d1e2e;border:1px solid #1a3a52;border-radius:7px;color:#4da6e8;font-size:16px;font-weight:700;width:30px;height:30px;cursor:pointer;font-family:inherit}
.wk-num{font-size:20px;font-weight:800;color:var(--text);min-width:28px;text-align:center}
.day-row{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dt{background:none;border:none;border-bottom:3px solid transparent;padding:6px 2px 7px;cursor:pointer;font-family:inherit;text-align:center;color:var(--muted)}
.dt.act{border-bottom-color:#4da6e8}
.dn{font-size:10px;font-weight:700}.dl{font-size:10px;font-weight:600;margin-top:1px}
.tabs{display:flex;background:var(--card);border-top:1px solid var(--bdr);position:sticky;bottom:0;z-index:100;box-shadow:0 -2px 8px rgba(0,0,0,0.08)}
body.dark .tabs{background:#13161e;border-color:#252a36}
.tab{flex:1;padding:8px 4px 10px;border:none;background:none;border-top:3px solid transparent;cursor:pointer;font-family:inherit;color:var(--muted);display:flex;flex-direction:column;align-items:center}
.tab.act{color:#4da6e8;border-top-color:#4da6e8}
.ti{font-size:20px;line-height:1;margin-bottom:2px}.tl{font-size:11px;font-weight:700}
.content{padding:12px;overflow-y:auto;min-height:60vh;background:var(--bg)}
.card{background:var(--card);border-radius:14px;border:1px solid var(--bdr);padding:13px;margin-bottom:12px;box-shadow:var(--shadow)}
body.dark .card{background:#1a1e28;border-color:#252a36}
.inp{width:100%;background:#1e2435;border:1.5px solid var(--bdr);border-radius:9px;padding:9px 11px;font-size:14px;color:var(--text);font-family:inherit;outline:none}
.inp:focus{border-color:#4da6e8}
body.dark .inp{background:#252a36;color:#e8eaf0;border-color:#2a3040}
select.inp{background:var(--bg)}
.lbl{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px;display:block}
input.sml{width:52px;border:2px solid var(--bdr);border-radius:8px;padding:8px 4px;font-size:17px;font-weight:700;text-align:center;color:var(--text);background:var(--bg);font-family:inherit;outline:none}
input.sml:focus{border-color:#4da6e8}
input.ti{width:72px;border:1.5px solid var(--bdr);border-radius:7px;padding:7px 5px;font-size:12px;text-align:center;color:var(--text);background:var(--bg);font-family:inherit;outline:none}
input.ni{border:1.5px solid var(--bdr);border-radius:8px;padding:8px 10px;font-size:13px;color:var(--text);background:var(--bg);font-family:inherit;outline:none}
.pc{background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:10px;border:1px solid var(--bdr);box-shadow:var(--shadow)}
body.dark .pc{background:#1a1e28;border-color:#252a36}
.pr{margin-bottom:7px}.ph{display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px}
.pl{color:var(--muted);font-weight:600}.pv{font-weight:700}
.pb{height:7px;background:#e8eaed;border-radius:4px;overflow:hidden}
.pf{height:100%;border-radius:4px;transition:width .3s}
.fli{background:var(--card);border-radius:10px;padding:9px 12px;margin-bottom:8px;border:1px solid var(--bdr);display:flex;justify-content:space-between;align-items:center;box-shadow:var(--shadow)}
body.dark .fli{background:#1a1e28;border-color:#252a36}
.fli-m{flex:1}.fli-n{font-size:13px;font-weight:600}.fli-s{font-size:11px;color:var(--muted)}
.fli-c{font-size:13px;font-weight:700;color:#4da6e8}
.bw-inp{border:1.5px solid var(--bdr);border-radius:7px;padding:5px 3px;font-size:12px;text-align:center;background:var(--bg);color:var(--text);font-family:inherit;width:100%;outline:none}
#rtimer{display:none;position:fixed;bottom:58px;left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:456px;background:#1a6fa8;border-radius:14px;padding:10px 14px;z-index:200;box-shadow:0 4px 20px rgba(0,0,0,.25)}
#rtimer.show{display:block}
.rt-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
#rt-name{font-size:11px;color:rgba(255,255,255,.8);font-weight:600}
#rt-cnt{font-size:26px;font-weight:800;color:#fff;letter-spacing:-1px}
.rt-btns{display:flex;gap:6px}
.rt-adj{background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:7px;padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
#rt-skip{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:7px;padding:4px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.rt-bar-wrap{height:4px;background:rgba(255,255,255,.2);border-radius:2px;margin-top:5px}
#rt-bar{height:100%;background:rgba(255,255,255,.9);border-radius:2px;transition:width .25s linear}
#manual-overlay,#plate-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;padding:16px;align-items:flex-end}
#manual-overlay.open,#plate-overlay.open{display:flex}
.overlay-card{background:var(--card);border-radius:18px;padding:16px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 -4px 24px rgba(0,0,0,.2)}
body.dark .overlay-card{background:#1a1e28}
.date-nav{display:flex;align-items:center;justify-content:space-between;padding:2px 0;margin-bottom:8px}
.date-btn{background:#0d1e2e;border:1px solid #1a3a52;border-radius:8px;color:#4da6e8;font-size:18px;width:32px;height:32px;cursor:pointer;font-family:inherit}
.date-lbl{font-size:13px;font-weight:700;color:var(--text)}
.saved-chip{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#1a7a44;color:#fff;border-radius:20px;padding:6px 16px;font-size:13px;font-weight:700;opacity:0;transition:opacity .3s;z-index:500;pointer-events:none}
@keyframes flash{0%{opacity:1}50%{opacity:.3}100%{opacity:1}}
.flashing{animation:flash .3s ease}
</style>

<body>

<div class="hdr">

<!-- Manual entry overlay -->

<script>
// MIGRATIONS
(function(){if(!localStorage.getItem("tf_migrated_v6")){localStorage.setItem("tf_prog_start","2026-08-10");localStorage.setItem("tf_migrated_v6","1");}})();
(function(){if(!localStorage.getItem("tf_migrated_v9")){localStorage.setItem("tf_prog_start","2026-08-24");localStorage.setItem("tf_migrated_v9","1");}})();
(function(){if(!localStorage.getItem("tf_migrated_v8")){localStorage.setItem("tf_prog_start","2026-08-25");localStorage.setItem("tf_migrated_v8","1");}})();
(function(){if(!localStorage.getItem("tf_migrated_v7")){localStorage.setItem("tf_prog_start","2026-08-17");localStorage.setItem("tf_migrated_v7","1");}})();
(function(){if(!localStorage.getItem("tf_migrated_v4")){localStorage.setItem("tf_cal_target","2000");localStorage.setItem("tf_migrated_v4","1");}})();
(function(){if(!localStorage.getItem("tf_migrated_v5")){if(!localStorage.getItem("tf_measurements")){localStorage.setItem("tf_measurements",JSON.stringify([{date:"2026-08-10",weight:203,chest:"",waist:"",rightArm:"",neck:"",note:"Starting weight"}]));}localStorage.setItem("tf_migrated_v5","1");}})();

// CONSTANTS
var DAY_NAMES=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
var TRAIN_DAYS=[0,2,4],RUCK_DAYS=[1,3,5];
function isTraining(d){return TRAIN_DAYS.indexOf(d)>=0;}
function isRuck(d){return RUCK_DAYS.indexOf(d)>=0;}
var HANDLES=[{k:"Blue",col:"#1a6fa8",m:"Chest"},{k:"Red",col:"#c0392b",m:"Shoulders"},{k:"Green",col:"#1a7a44",m:"Triceps"}];
function getPhaseLbl(w){
  if(w===0)return"Test Week - Week 1 Progressions";
  var p=prog(w);
  var lbl={1:"Phase 1 - Push Board + DB Rows",2:"Phase 2 - Incline Push-Ups + Ring Rows",3:"Phase 3 - Ring Dips + Pull-Ups"}[p.ph];
  return lbl+(p.deload?" DELOAD WEEK":"");
}

// PROGRESSION
function prog(w){
  var d=w===4||w===8||w===12||w===16||w===20||w===24;
  var b;
  if(w<=4)   b={ph:1,ps:4,pr:"10-12",ds:3,dr:"6-10", rs:4,rr:"10-12",fs:3,fr:"12-15",cs:3,cr:"10-12",hs:3,ht:20,ss:3,sr:"10-12",ks:3,kr:"15"};
  else if(w<=8)  b={ph:1,ps:4,pr:"8-10", ds:3,dr:"8-10", rs:4,rr:"8-10", fs:3,fr:"12-15",cs:3,cr:"8-10", hs:3,ht:25,ss:3,sr:"12-15",ks:3,kr:"20"};
  else if(w<=12) b={ph:1,ps:4,pr:"10-12",ds:3,dr:"10-12",rs:4,rr:"10-12",fs:3,fr:"15",   cs:3,cr:"10-12",hs:3,ht:30,ss:4,sr:"12-15",ks:4,kr:"15"};
  else if(w<=16) b={ph:2,ps:3,pr:"10-12",ds:3,dr:"10-12",rs:3,rr:"8-10", fs:3,fr:"15",   cs:3,cr:"10-12",hs:3,ht:30,ss:4,sr:"15",   ks:4,kr:"20"};
  else if(w<=20) b={ph:2,ps:4,pr:"10-12",ds:3,dr:"12-15",rs:4,rr:"10-12",fs:3,fr:"15",   cs:3,cr:"12-15",hs:3,ht:35,ss:4,sr:"15-20",ks:4,kr:"25"};
  else if(w<=24) b={ph:3,ps:3,pr:"5-6",  ds:3,dr:"12-15",rs:3,rr:"3-5 neg",fs:3,fr:"15", cs:3,cr:"10-12",hs:3,ht:35,ss:5,sr:"15",   ks:4,kr:"20"};
  else if(w===25)b={ph:3,ps:4,pr:"6-8",  ds:3,dr:"15",   rs:4,rr:"5-6",  fs:3,fr:"15",   cs:3,cr:"12-15",hs:3,ht:40,ss:5,sr:"15-20",ks:5,kr:"20"};
  else           b={ph:3,ps:5,pr:"8-10", ds:3,dr:"15",   rs:5,rr:"6-8",  fs:3,fr:"15",   cs:3,cr:"12-15",hs:3,ht:40,ss:5,sr:"15-20",ks:5,kr:"20"};
  if(d){var r=Object.assign({},b);["ps","ds","rs","fs","cs","hs","ss","ks"].forEach(function(k){r[k]=Math.max(2,Math.round(b[k]/2));});r.ht=Math.max(15,Math.round(b.ht*0.6));r.deload=true;return r;}
  b.deload=false;return b;
}

// MACROS
function getStartWeight(){return parseFloat(localStorage.getItem("tf_start_weight"))||203;}
function setStartWeight(w){localStorage.setItem("tf_start_weight",w);markDirty("goals");paint();}
function getGoalWeight(){return parseFloat(localStorage.getItem("tf_goal_weight"))||175;}
function setGoalWeight(w){localStorage.setItem("tf_goal_weight",w);markDirty("goals");paint();}

function getWeekSchedule(w){
  var key="sched_w"+(w||W);
  var stored=localStorage.getItem(key);
  if(stored){try{return JSON.parse(stored);}catch(e){}}
  // Default schedule: Mon/Wed/Fri=Workout, Tue/Thu/Sat=Ruck, Sun=Rest
  return ["workout","ruck","workout","ruck","workout","ruck","rest"];
}
function saveWeekSchedule(sched,w){
  localStorage.setItem("sched_w"+(w||W),JSON.stringify(sched));
}
function getDayType(dayIdx,w){
  return getWeekSchedule(w||W)[dayIdx];
}
function isTrainingDay(d,w){return getDayType(d,w||W)==="workout";}
function isRuckDay(d,w){return getDayType(d,w||W)==="ruck";}

// =========================================================================
// ADAPTIVE PROGRESSION TRACKING
// =========================================================================
function getRepTop(rangeStr){
  // Extract top of rep range e.g. "10-12" -> 12, "15" -> 15, "3-5 neg" -> 5
  var m=rangeStr.match(/(\d+)(?:[^0-9]|$)(?:.*?(\d+))?/);
  if(!m) return 99;
  var nums=rangeStr.match(/\d+/g);
  if(!nums) return 99;
  return parseInt(nums[nums.length-1]);
}

function getSessionData(w, dayIdx){
  // Get stored workout data for a given week/day
  var key="s_w"+w+"_"+["Mon","Tue","Wed","Thu","Fri","Sat","Sun"][dayIdx];
  try{var d=localStorage.getItem(key);return d?JSON.parse(d):null;}catch(e){return null;}
}

function getTrainingDaysForWeek(w){
  // Get the indices of training days for a given week
  var sched=getWeekSchedule(w);
  var days=[];
  for(var i=0;i<7;i++){if(sched[i]==="workout")days.push(i);}
  return days;
}

function checkProgression(exKey, repRange, numSets, lookbackWeeks){
  // Returns {ready:bool, sessions:int} 
  // Checks last 2 training sessions where this exercise was logged
  var top=getRepTop(repRange);
  var sessions=[];
  var weeksToCheck=lookbackWeeks||4;

  for(var w=W;w>=Math.max(1,W-weeksToCheck);w--){
    var trainDays=getTrainingDaysForWeek(w);
    for(var di=trainDays.length-1;di>=0;di--){
      var data=getSessionData(w,trainDays[di]);
      if(!data) continue;
      // Check all sets for this exercise
      var allHit=true;
      var anyLogged=false;
      for(var s=1;s<=numSets;s++){
        // Try different key patterns
        var val=null;
        if(data[exKey]&&data[exKey]["s"+s]) val=parseInt(data[exKey]["s"+s]);
        else {
          // Try flat key
          var flatKey=exKey+".s"+s;
          var parts=flatKey.split(".");
          var cur=data;
          for(var p=0;p<parts.length;p++){if(!cur)break;cur=cur[parts[p]];}
          if(cur) val=parseInt(cur);
        }
        if(val>0) anyLogged=true;
        if(!val||val<top) allHit=false;
      }
      if(anyLogged) sessions.push(allHit);
      if(sessions.length>=2) break;
    }
    if(sessions.length>=2) break;
  }
  var consecutive=sessions.length>=2&&sessions[0]&&sessions[1];
  return{ready:consecutive,sessions:sessions.length,hitTop:sessions[0]||false};
}

function getProgressionStatus(){
  var p=prog(W===0?1:W);
  var results={};

  // Pull/Rows
  var pullCheck=checkProgression("pull",p.rr,p.rs);
  results.pull={label:"DB Rows",action:"+2.5 lb next session",ready:pullCheck.ready,hit:pullCheck.hitTop};

  // Curls
  var curlCheck=checkProgression("curl",p.cr,p.cs);
  results.curl={label:"DB Curls",action:"+2.5 lb next session",ready:curlCheck.ready,hit:curlCheck.hitTop};

  // KB Swings
  var kbCheck=checkProgression("kb",p.kr,p.ks);
  results.kb={label:"KB Swings",action:"Move to heavier kettlebell",ready:kbCheck.ready,hit:kbCheck.hitTop};

  // Split Squats
  var ssCheck=checkProgression("ss",p.sr,p.ss);

function formatAIResult(text){
  if(!text) return "";
  // Convert markdown-like formatting to styled HTML
  var lines=text.split("\n");
  var html="";
  for(var i=0;i<lines.length;i++){
    var line=lines[i];
    var trimmed=line.trim();
    if(!trimmed){html+="<div style=\"height:6px\"></div>";continue;}
    // Bold headers: **text** or lines ending in : that look like headers
    if(trimmed.match(/^\*\*(.+)\*\*$/)){
      html+="<div style=\"font-size:13px;font-weight:800;color:#4da6e8;margin-top:10px;margin-bottom:4px\">"+trimmed.replace(/\*\*/g,"")+"</div>";
    } else if(trimmed.match(/^#{1,3} /)){
      html+="<div style=\"font-size:13px;font-weight:800;color:#4da6e8;margin-top:10px;margin-bottom:4px\">"+trimmed.replace(/^#{1,3} /,"")+"</div>";
    } else if(trimmed.match(/^(Superset|SUPERSET)/)){
      html+="<div style=\"font-size:13px;font-weight:800;color:#4da6e8;background:#0d1e2e;border-radius:7px;padding:6px 10px;margin-top:10px;margin-bottom:4px\">"+trimmed+"</div>";
    } else if(trimmed.match(/^[-•*] /)){
      var item=trimmed.replace(/^[-•*] /,"");
      // Bold any **text** within
      item=item.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
      html+="<div style=\"display:flex;gap:8px;margin-bottom:3px\"><span style=\"color:#4da6e8;flex-shrink:0\">&#8226;</span><span style=\"font-size:13px;line-height:1.5\">"+item+"</span></div>";
    } else if(trimmed.match(/^\d+\. /)){
      var item2=trimmed.replace(/^\d+\. /,"");
      item2=item2.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
      html+="<div style=\"font-size:13px;line-height:1.5;margin-bottom:3px\">"+item2+"</div>";
    } else {
      // Regular line - bold inline **text**
      var formatted=trimmed.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
      html+="<div style=\"font-size:13px;line-height:1.6;margin-bottom:2px\">"+formatted+"</div>";
    }
  }
  return html;
}

function parseAIWorkout(text){
  if(!text) return null;
  // Try [JSON]...[/JSON] markers (primary)
  var m=text.match(/\[JSON\]([\s\S]*?)\[\/JSON\]/);
  // Fallback: ```json...``` blocks
  if(!m) m=text.match(/```json\s*([\s\S]*?)\s*```/);
  if(!m) m=text.match(/```\s*(\{[\s\S]*?\})\s*```/);
  // Last resort: bare JSON object
  if(!m){var bare=text.match(/(\{[\s\S]*"exercises"[\s\S]*\})/);if(bare)m=[null,bare[1]];}
  if(!m) return null;
  try{
    var d=JSON.parse(m[1].trim());
    if(d&&d.exercises&&Array.isArray(d.exercises)&&d.exercises.length>0) return d;
    return null;
  }catch(e){return null;}
}

function getBestStreak(){
  var best=0,current=0;
  for(var w=1;w<=W;w++){
    var sched=getWeekSchedule(w);
    var wDone=0,rDone=0;
    var wDays=[],rDays=[];
    for(var d=0;d<7;d++){
      if(sched[d]==="workout")wDays.push(d);
      if(sched[d]==="ruck")rDays.push(d);
    }
    wDays.forEach(function(d){var data=getSessionData(w,d);if(data&&Object.keys(data).length>0)wDone++;});
    rDays.forEach(function(d){var data=getSessionData(w,d);if(data&&data.ruck&&data.ruck.done==="done")rDone++;});
    if(wDone>=2&&rDone>=2){current++;if(current>best)best=current;}
    else current=0;
  }
  return best;
}

  var tmr=document.getElementById("rtimer");if(tmr)tmr.classList.add("show");
  tickTimer();
}
function playBeeps(){
  try{
    var ctx=new(window.AudioContext||window.webkitAudioContext)();
    function beep(startTime,freq,dur,vol){
      var osc=ctx.createOscillator();
      var gain=ctx.createGain();
      osc.connect(gain);gain.connect(ctx.destination);
      osc.frequency.value=freq;
      osc.type="sine";
      gain.gain.setValueAtTime(0,startTime);
      gain.gain.linearRampToValueAtTime(vol||0.4,startTime+0.01);
      gain.gain.linearRampToValueAtTime(0,startTime+dur);
      osc.start(startTime);
      osc.stop(startTime+dur+0.05);
    }
    var t=ctx.currentTime;
    beep(t,880,0.12,0.3);      // beep 1
    beep(t+0.18,880,0.12,0.3); // beep 2
    beep(t+0.36,1320,0.5,0.5); // final bell
  }catch(e){}
}
function tickTimer(){
  RT_REM=Math.max(0,Math.ceil((RT_END-Date.now())/1000));
  var m=Math.floor(RT_REM/60),s=RT_REM%60;
  var cnt=document.getElementById("rt-cnt");

  if(bar)bar.style.width=(RT_TOT>0?(RT_REM/RT_TOT*100):0)+"%";
  if(RT_REM>0){
    RT_IV=setTimeout(tickTimer,250);
  } else {
    RT_IV=null;
    if(bar){bar.style.background="rgba(255,255,255,.9)";bar.style.opacity="1";}
    if(cnt)cnt.textContent="Go!";
    playBeeps();
  }
}

function searchUSDA(q,el){
  FOOD_SEARCHING=true;
  // Include Branded for real-world foods (Chipotle, Quest bars, etc.)
  var url="https://api.nal.usda.gov/fdc/v1/foods/search?api_key=DEMO_KEY"
    +"&query="+encodeURIComponent(q)
    +"&pageSize=10"
    +"&dataType=Branded,Foundation,SR%20Legacy,Survey%20(FNDDS)";
  fetch(url)
    .then(function(r){return r.json();})
    .then(function(data){
      FOOD_SEARCHING=false;
      var foods=data.foods||[];
      SRESULTS=foods.map(function(f){
        var nuts=f.foodNutrients||[];
        // USDA uses nutrientId (int) for Foundation/SR/FNDDS
        // Branded may use nutrientNumber (string "208","203","204","205")
        function get(ids,numStr){
          for(var i=0;i<nuts.length;i++){
            var n=nuts[i];
            if(ids.indexOf(n.nutrientId)>=0||n.nutrientNumber===numStr){
              if(n.value>0) return Math.round(n.value*10)/10;
            }
          }
          return 0;
        }
        var cal=get([1008],"208");
        var pro=get([1003],"203");
        var carb=get([1005],"205");
        var fat=get([1004],"204");
        // Build name — prefer brand + description for branded items
        var name=f.description||"";
        if(f.brandOwner&&f.brandOwner.length<20) name=f.brandOwner+" "+name;
        name=name.replace(/,?\s*raw$/i,"").replace(/,?\s*NFS$/i,"").replace(/,?\s*UPC.*/i,"");
        if(name.length>50) name=name.substring(0,48)+"...";
        // servingSize for branded
        var srv=f.servingSize||(f.servingSizeUnit?"":100);
        return{name:name.trim(),cal100:cal,pro100:pro,carb100:carb,fat100:fat,defServing:srv||100,servingUnit:f.servingSizeUnit||"g"};
      }).filter(function(f){return f.cal100>0;});
      if(!SRESULTS.length){
        el.innerHTML="<div style=\"font-size:12px;color:#8a9bb0;padding:8px 0\">No results — try a simpler term</div>";
        return;
      }
      el.innerHTML=SRESULTS.map(function(r,i){
        var macroStr=r.pro100+"g P &middot; "+r.carb100+"g C &middot; "+r.fat100+"g F";
        return"<div class=\"sri\" data-result=\""+i+"\"><div class=\"sri-n\">"+r.name+"</div>"
          +"<div class=\"sri-c\">"+r.cal100+" cal &middot; "+macroStr+" <span style=\"color:#8a9bb0\">(per 100g)</span></div></div>";
      }).join("");
    })
    .catch(function(){
      FOOD_SEARCHING=false;
      SRESULTS=[];
      el.innerHTML="<div style=\"font-size:12px;color:#e05c52;padding:8px 0\">Search failed — check connection or add manually</div>";
    });
}

// REST TIMER — recursive setTimeout, wall-clock based
var RT_END=0,RT_TOT=0,RT_REM=0,RT_IV=null;
function startRest(secs,name){
  if(RT_IV){clearTimeout(RT_IV);RT_IV=null;}
  RT_TOT=secs;RT_REM=secs;RT_END=Date.now()+(secs*1000);
  var el=document.getElementById("rt-name");if(el)el.textContent=name;
  var cnt=document.getElementById("rt-cnt");if(cnt)cnt.style.color="#fff";
  var bar=document.getElementById("rt-bar");if(bar){bar.style.background="#fff";bar.style.opacity="0.7";}
  var tmr=document.getElementById("rtimer");if(tmr)tmr.classList.add("show");
  tickTimer();
}
function playBeeps(){
  try{
    var ctx=new(window.AudioContext||window.webkitAudioContext)();
    function beep(startTime,freq,dur,vol){
      var osc=ctx.createOscillator();
      var gain=ctx.createGain();
      osc.connect(gain);gain.connect(ctx.destination);
      osc.frequency.value=freq;
      osc.type="sine";
      gain.gain.setValueAtTime(0,startTime);
      gain.gain.linearRampToValueAtTime(vol||0.4,startTime+0.01);
      gain.gain.linearRampToValueAtTime(0,startTime+dur);
      osc.start(startTime);
      osc.stop(startTime+dur+0.05);
    }
    var t=ctx.currentTime;
    beep(t,880,0.12,0.3);      // beep 1
    beep(t+0.18,880,0.12,0.3); // beep 2
    beep(t+0.36,1320,0.5,0.5); // final bell
  }catch(e){}
}
function tickTimer(){
  RT_REM=Math.max(0,Math.ceil((RT_END-Date.now())/1000));
  var m=Math.floor(RT_REM/60),s=RT_REM%60;
  var cnt=document.getElementById("rt-cnt");
  var bar=document.getElementById("rt-bar");
  if(cnt)cnt.textContent=m+":"+(s<10?"0":"")+s;
  if(bar)bar.style.width=(RT_TOT>0?(RT_REM/RT_TOT*100):0)+"%";
  if(RT_REM>0){
    RT_IV=setTimeout(tickTimer,250);
  } else {
    RT_IV=null;
    if(bar){bar.style.background="rgba(255,255,255,.9)";bar.style.opacity="1";}
    if(cnt)cnt.textContent="Go!";
    playBeeps();
  }
}
function stopRest(){if(RT_IV){clearTimeout(RT_IV);RT_IV=null;}RT_END=0;var t=document.getElementById("rtimer");if(t)t.classList.remove("show");}
function addTime(s){RT_END+=s*1000;RT_REM=Math.max(0,Math.ceil((RT_END-Date.now())/1000));RT_TOT=Math.max(RT_TOT,RT_REM);}

function bWeeklySummary(){
  var BWD=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  var sched=getWeekSchedule(W);
  var workoutDays=[],ruckDays=[];
  for(var d=0;d<7;d++){if(sched[d]==="workout")workoutDays.push(d);if(sched[d]==="ruck")ruckDays.push(d);}
  var workoutsDone=0,rucksDone=0;
  workoutDays.forEach(function(d){var data=getSessionData(W,d);if(data&&Object.keys(data).length>0)workoutsDone++;});
  ruckDays.forEach(function(d){var data=getSessionData(W,d);if(data&&data.ruck&&data.ruck.done==="done")rucksDone++;});
  var bwRaw=localStorage.getItem("bw_w"+W);
  var bwObj=bwRaw?JSON.parse(bwRaw):{};
  var bwVals=BWD.map(function(d){return parseFloat(bwObj[d]);}).filter(function(v){return!isNaN(v)&&v>0;});
  var bwAvg=bwVals.length?Math.round(bwVals.reduce(function(a,b){return a+b;},0)/bwVals.length*10)/10:null;
  var calTotal=0,calDays=0;
  for(var d=0;d<7;d++){var dt=getDateForDay(W,d);var lg=null;try{lg=JSON.parse(localStorage.getItem("food_"+dt)||"null");}catch(e){}if(lg&&lg.length){calTotal+=foodTot(lg).cal;calDays++;}}
  var calAvg=calDays>0?Math.round(calTotal/calDays):null;
  var wOk=workoutsDone===workoutDays.length;
  var rOk=rucksDone===ruckDays.length;
  var perfect=wOk&&rOk;
  var good=workoutsDone>=workoutDays.length-1&&rucksDone>=ruckDays.length-1;
  var grade=perfect?"&#127942; Perfect week!":good?"&#128079; Solid week":"&#128165; Keep pushing";
  var gradCol=perfect?"#3dd68c":good?"#4da6e8":"#8a9bb0";
  return "<div style=\"background:#22273a;border-radius:12px;border:1px solid #2e3347;margin-bottom:10px;overflow:hidden\">"
    +"<div style=\"background:#1a6fa8;padding:10px 13px;display:flex;align-items:center;gap:8px\">"
    +"<span style=\"font-size:16px\">&#128203;</span>"
    +"<span style=\"font-size:13px;font-weight:700;color:#fff\">Week "+W+" Summary</span></div>"
    +"<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#2e3347\">"
    +"<div style=\"background:#22273a;padding:14px;text-align:center\"><div style=\"font-size:24px;font-weight:700;color:"+(wOk?"#1a7a44":"#c0580a")+"\">"+workoutsDone+"/"+workoutDays.length+"</div><div style=\"font-size:12px;color:#8a9bb0\">WORKOUTS</div></div>"
    +"<div style=\"background:#22273a;padding:14px;text-align:center\"><div style=\"font-size:24px;font-weight:700;color:"+(rOk?"#1a7a44":"#c0580a")+"\">"+rucksDone+"/"+ruckDays.length+"</div><div style=\"font-size:12px;color:#8a9bb0\">RUCKS</div></div>"
    +(bwAvg?"<div style=\"background:#22273a;padding:14px;text-align:center;border-top:1px solid #2e3347\"><div style=\"font-size:24px;font-weight:700;color:#e8eaf0\">"+bwAvg+"</div><div style=\"font-size:12px;color:#8a9bb0\">AVG WEIGHT (lb)</div></div>":"")
    +(calAvg?"<div style=\"background:#22273a;padding:14px;text-align:center;border-top:1px solid #2e3347\"><div style=\"font-size:24px;font-weight:700;color:"+(Math.abs(calAvg-getCalTarget())<150?"#1a7a44":"#c0580a")+"\">"+calAvg+"</div><div style=\"font-size:12px;color:#8a9bb0\">AVG CALORIES</div></div>":"")
    +"<div style=\"padding:10px 13px;text-align:center;border-top:1px solid #d1d5db;font-size:13px;font-weight:700;color:"+gradCol+"\">"+grade+"</div>"
    +"</div>";
}

// MACRO RING SVG
function macroRing(pro,carb,fat,proT,carbT,fatT,calT,calLogged){
  var PI2=2*Math.PI;
  var R=44,cx=60,cy=60,sw=14;
  var circ=PI2*R;
  // Segment fractions — how much of each target consumed
  var pFrac=proT>0?Math.min(1,pro/proT):0;
  var cFrac=carbT>0?Math.min(1,carb/carbT):0;
  var fFrac=fatT>0?Math.min(1,fat/fatT):0;
  // Each segment occupies 1/3 of the ring (by calorie target weight)
  var proSlice=circ/3,carbSlice=circ/3,fatSlice=circ/3;
  // Calculate remaining calories
  var calRem=Math.max(0,calT-calLogged);
  var pct=calT>0?Math.round(calLogged/calT*100):0;
  // Arc helper
  function arc(frac,offset,color,slice){
    var len=Math.max(0,frac*slice);
    var gap=circ-len;
    var dasharray=len+" "+gap;
    var dashoffset=-(offset);
    return"<circle cx=\""+cx+"\" cy=\""+cy+"\" r=\""+R+"\" fill=\"none\" stroke=\""+color+"\" stroke-width=\""+sw+"\" stroke-dasharray=\""+dasharray+"\" stroke-dashoffset=\""+dashoffset+"\" stroke-linecap=\"round\"/>";
  }
  // Background ring
  var bg="<circle cx=\""+cx+"\" cy=\""+cy+"\" r=\""+R+"\" fill=\"none\" stroke=\"#f0f0f0\" stroke-width=\""+sw+"\"/>";
  // Three segments: protein (blue), carbs (orange), fat (green)
  // Each occupies 1/3 of ring, starting at top (-90deg = -circ/4 offset)
  var startOffset=circ*0.25; // start at top
  var proArc=arc(pFrac,startOffset,"#1a6fa8",proSlice);
  var carbArc=arc(cFrac,startOffset-proSlice,"#c0580a",carbSlice);
  var fatArc=arc(fFrac,startOffset-proSlice-carbSlice,"#1a7a44",fatSlice);
  return"<div style=\"display:flex;align-items:center;gap:12px;padding:10px 0\">"
    +"<svg viewBox=\"0 0 120 120\" width=\"90\" height=\"90\" style=\"flex-shrink:0\">"+bg+proArc+carbArc+fatArc
    +"<text x=\"60\" y=\"56\" text-anchor=\"middle\" style=\"font-size:17px;font-weight:700;fill:#222\">"+calRem+"</text>"
    +"<text x=\"60\" y=\"70\" text-anchor=\"middle\" style=\"font-size:11px;fill:#999\">cal left</text>"
    +"</svg>"
    +"<div style=\"flex:1\">"
    +"<div style=\"display:flex;align-items:center;gap:5px;margin-bottom:4px\"><div style=\"width:10px;height:10px;border-radius:50%;background:#1a6fa8;flex-shrink:0\"></div><span style=\"font-size:11px\">Protein <b>"+Math.round(pro)+"</b>/"+proT+"g</span></div>"
    +"<div style=\"display:flex;align-items:center;gap:5px;margin-bottom:4px\"><div style=\"width:10px;height:10px;border-radius:50%;background:#c0580a;flex-shrink:0\"></div><span style=\"font-size:11px\">Carbs <b>"+Math.round(carb)+"</b>/"+carbT+"g</span></div>"
    +"<div style=\"display:flex;align-items:center;gap:5px\"><div style=\"width:10px;height:10px;border-radius:50%;background:#1a7a44;flex-shrink:0\"></div><span style=\"font-size:11px\">Fat <b>"+Math.round(fat)+"</b>/"+fatT+"g</span></div>"
    +"</div></div>";
}

function weightChart(){
  var weeks=[];
  for(var w=1;w<=W;w++){
    var bwRaw=localStorage.getItem("bw_w"+w);
    if(!bwRaw) continue;
    try{
      var obj=JSON.parse(bwRaw);
      var vals=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(function(d){return parseFloat(obj[d]);}).filter(function(v){return!isNaN(v)&&v>0;});
      if(vals.length>0){
        var avg=Math.round(vals.reduce(function(a,b){return a+b;},0)/vals.length*10)/10;
        weeks.push({w:w,avg:avg});
      }
    }catch(e){}
  }
  if(weeks.length<2) return"<div style=\"background:#22273a;border-radius:12px;border:1px solid #2e3347;padding:14px 13px;margin-bottom:10px;text-align:center;color:#6b6b6b;font-size:12px\">Log weight for 2+ weeks to see your trend chart</div>";
  // SVG dimensions
  var svgW=300,svgH=120,padL=34,padR=10,padT=10,padB=20;
  var chartW=svgW-padL-padR,chartH=svgH-padT-padB;
  var vals=weeks.map(function(w){return w.avg;});
  var minV=Math.min.apply(null,vals)-2,maxV=Math.max.apply(null,vals)+2;
  var goal=getGoalWeight();
  var xScale=function(i){return padL+i*(chartW/(weeks.length-1));};
  var yScale=function(v){return padT+chartH-(v-minV)/(maxV-minV)*chartH;};
  // Build path
  var points=weeks.map(function(wk,i){return xScale(i)+","+yScale(wk.avg);});
  var path="M"+points.join(" L");
  // Goal line y
  var goalY=yScale(Math.max(minV,Math.min(maxV,goal)));
  // Start weight line
  var startW=getStartWeight();
  var startY=yScale(Math.max(minV,Math.min(maxV,startW)));
  var svg="<svg viewBox=\"0 0 "+svgW+" "+svgH+"\" style=\"width:100%;height:auto\">"
    // Grid lines
    +"<line x1=\""+padL+"\" y1=\""+padT+"\" x2=\""+padL+"\" y2=\""+padT+chartH+"\" stroke=\"#eee\" stroke-width=\"1\"/>"
    // Goal line (dashed)
    +(goal>minV&&goal<maxV?"<line x1=\""+padL+"\" y1=\""+goalY+"\" x2=\""+(svgW-padR)+"\" y2=\""+goalY+"\" stroke=\"#1a7a44\" stroke-width=\"1.5\" stroke-dasharray=\"4,3\"/><text x=\""+padL+"\" y=\""+Math.max(padT+8,goalY-3)+"\" style=\"font-size:8px;fill:#1a7a44\">Goal</text>":"")
    // Weight line
    +"<path d=\""+path+"\" fill=\"none\" stroke=\"#1a6fa8\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>"
    // Data points
    +weeks.map(function(wk,i){
      return"<circle cx=\""+xScale(i)+"\" cy=\""+yScale(wk.avg)+"\" r=\"3.5\" fill=\"#1a6fa8\"/>";
    }).join("")
    // X labels (every other week for readability)
    +weeks.map(function(wk,i){
      if(i===0||i===weeks.length-1||(weeks.length>6&&i%2!==0)) return"";
      return"<text x=\""+xScale(i)+"\" y=\""+(svgH-4)+"\" text-anchor=\"middle\" style=\"font-size:7px;fill:#999\">W"+wk.w+"</text>";
    }).join("")
    // First and last X labels
    +"<text x=\""+xScale(0)+"\" y=\""+(svgH-4)+"\" text-anchor=\"middle\" style=\"font-size:7px;fill:#999\">W"+weeks[0].w+"</text>"
    +"<text x=\""+xScale(weeks.length-1)+"\" y=\""+(svgH-4)+"\" text-anchor=\"middle\" style=\"font-size:7px;fill:#999\">W"+weeks[weeks.length-1].w+"</text>"
    // Y axis labels (first and last value)
    +"<text x=\""+(padL-2)+"\" y=\""+(padT+4)+"\" text-anchor=\"end\" style=\"font-size:8px;fill:#999\">"+Math.round(maxV)+"</text>"
    +"<text x=\""+(padL-2)+"\" y=\""+(padT+chartH)+"\" text-anchor=\"end\" style=\"font-size:8px;fill:#999\">"+Math.round(minV)+"</text>"
    +"</svg>";
  var firstW=weeks[0].avg,lastW=weeks[weeks.length-1].avg;
  var diff=Math.round((firstW-lastW)*10)/10;
  return"<div style=\"background:#22273a;border-radius:12px;border:1px solid #2e3347;padding:12px 13px;margin-bottom:10px\">"
    +"<div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:8px\">"
    +"<div style=\"font-size:13px;font-weight:700\">Weight Trend</div>"
    +(diff>0?"<div style=\"font-size:12px;color:#3dd68c;font-weight:700\">-"+diff+" lb lost</div>":diff<0?"<div style=\"font-size:12px;color:#f5a623;font-weight:700\">+"+Math.abs(diff)+" lb</div>":"<div style=\"font-size:12px;color:#8a9bb0\">Tracking...</div>")
    +"</div>"
    +svg
    +"</div>";
}

function getWeekVolume(w){
  var sched=getWeekSchedule(w);
  var total=0;
  var EX_KEYS=["push","pull","dec","curl","fp","hb","ss","kb"];
  for(var d=0;d<7;d++){
    var data=getSessionData(w,d);
    if(!data) continue;
    // Main program sets
    if(sched[d]==="workout"){
      EX_KEYS.forEach(function(k){
        var ex=data[k];
        if(!ex) return;
        for(var s=1;s<=8;s++){if(ex["s"+s]&&parseInt(ex["s"+s])>0)total++;}
      });
    }
    // AI workout sets
    Object.keys(data).forEach(function(k){
      if(k.indexOf("ai_")===0&&typeof data[k]==="object"){
        for(var s=1;s<=8;s++){if(data[k]["s"+s]&&parseInt(data[k]["s"+s])>0)total++;}
      }
    });
  }
  return total;
}
function getWeekRuckPace(w){
  var sched=getWeekSchedule(w);
  var paces=[];
  for(var d=0;d<7;d++){
    if(sched[d]!=="ruck") continue;
    var data=getSessionData(w,d);
    if(!data||!data.ruck) continue;
    var dist=parseFloat(data.ruck.dist);
    var tm=data.ruck.time;
    if(!dist||!tm) continue;
    var parts=tm.split(":");
    var mins=parts.length===2?parseInt(parts[0])+parseInt(parts[1])/60:parseInt(parts[0]);
    if(dist>0&&mins>0) paces.push(Math.round(mins/dist*10)/10);
  }
  return paces.length?Math.round(paces.reduce(function(a,b){return a+b;},0)/paces.length*10)/10:null;
}
function svgBarChart(data,color,yLabel,formatVal){
  if(!data.length) return"";
  var svgW=300,svgH=100,padL=30,padR=8,padT=8,padB=18;
  var chartW=svgW-padL-padR,chartH=svgH-padT-padB;
  var vals=data.map(function(d){return d.val;});
  var maxV=Math.max.apply(null,vals)||1;
  var barW=Math.max(4,Math.floor(chartW/data.length)-2);
  var bars=data.map(function(d,i){
    var x=padL+i*(chartW/data.length)+1;
    var h=Math.max(2,d.val/maxV*chartH);
    var y=padT+chartH-h;
    return"<rect x=\""+x+"\" y=\""+y+"\" width=\""+barW+"\" height=\""+h+"\" rx=\"2\" fill=\""+color+"\" opacity=\""+(d.val>0?1:0.15)+"\"\/>"
      +(i===0||i===data.length-1?"<text x=\""+(x+barW/2)+"\" y=\""+(svgH-4)+"\" text-anchor=\"middle\" style=\"font-size:7px;fill:#999\">W"+d.w+"</text>":"");
  }).join("");
  return"<svg viewBox=\"0 0 "+svgW+" "+svgH+"\" style=\"width:100%;height:auto\">"
    +"<text x=\""+(padL-2)+"\" y=\""+(padT+4)+"\" text-anchor=\"end\" style=\"font-size:8px;fill:#999\">"+formatVal(maxV)+"</text>"
    +bars
    +"</svg>";
}

function bProgress(){
  var h="";
  var BWD=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];

  // ── Streak + start/goal (moved from Goals) ──────────────────────────
  function calcStreak2(){
    var streak=0;
    for(var w=W-1;w>=1;w--){
      var sched2=getWeekSchedule(w);
      var wD=[],rD=[];
      for(var d=0;d<7;d++){if(sched2[d]==="workout")wD.push(d);if(sched2[d]==="ruck")rD.push(d);}
      var wDone=0,rDone=0;
      wD.forEach(function(d){var data=getSessionData(w,d);if(data&&Object.keys(data).length>0)wDone++;});
      rD.forEach(function(d){var data=getSessionData(w,d);if(data&&data.ruck&&data.ruck.done==="done")rDone++;});
      if(wDone>=2&&rDone>=2) streak++; else break;
    }
    return streak;
  }
  var streak=calcStreak2();

function haversine(lat1,lon1,lat2,lon2){
  var R=3958.8; // miles
  var dLat=(lat2-lat1)*Math.PI/180;
  var dLon=(lon2-lon1)*Math.PI/180;
  var a=Math.sin(dLat/2)*Math.sin(dLat/2)
    +Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)
    *Math.sin(dLon/2)*Math.sin(dLon/2);
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function fmtElapsed(ms){
  var s=Math.floor(ms/1000);
  var m=Math.floor(s/60);
  var h=Math.floor(m/60);
  return(h>0?h+":":"")+(h>0?(m%60<10?"0":""):"")+m%60+":"+(s%60<10?"0":"")+s%60;
}
function fmtPace(miles,ms){
  if(miles<0.05) return "--:--";
  var minPerMile=(ms/1000/60)/miles;
  var m=Math.floor(minPerMile);
  var s=Math.round((minPerMile-m)*60);
  return m+":"+(s<10?"0":"")+s+" /mi";
}
function onRuckPosition(pos){
  if(!RUCK_TRACKING) return;
  RUCK_POSITIONS.push({lat:pos.coords.latitude,lng:pos.coords.longitude,t:Date.now()});
  if(RUCK_POSITIONS.length>=2){
    var total=0;
    for(var i=1;i<RUCK_POSITIONS.length;i++){
      total+=haversine(RUCK_POSITIONS[i-1].lat,RUCK_POSITIONS[i-1].lng,
                       RUCK_POSITIONS[i].lat,RUCK_POSITIONS[i].lng);
    }
    RUCK_LIVE_DIST=Math.round(total*100)/100;
  }
  RUCK_LIVE_ELAPSED=Date.now()-RUCK_START_TIME;
  // Update live display directly
  var distEl=document.getElementById("ruck-live-dist");
  var timeEl=document.getElementById("ruck-live-time");
  var paceEl=document.getElementById("ruck-live-pace");
  if(distEl) distEl.textContent=RUCK_LIVE_DIST.toFixed(2)+" mi";
  if(timeEl) timeEl.textContent=fmtElapsed(RUCK_LIVE_ELAPSED);
  if(paceEl) paceEl.textContent=fmtPace(RUCK_LIVE_DIST,RUCK_LIVE_ELAPSED);
}
function startRuckTracking(){
  if(!navigator.geolocation){
    alert("GPS not available on this device.");return;
  }
  RUCK_TRACKING=true;
  RUCK_POSITIONS=[];
  RUCK_LIVE_DIST=0;
  RUCK_START_TIME=Date.now();
  RUCK_WATCH_ID=navigator.geolocation.watchPosition(onRuckPosition,
    function(err){console.log("GPS error:",err.message);},
    {enableHighAccuracy:true,maximumAge:5000,timeout:10000});
  markDirty("workout");paint();
}
function stopRuckTracking(){
  if(RUCK_WATCH_ID!==null) navigator.geolocation.clearWatch(RUCK_WATCH_ID);
  RUCK_WATCH_ID=null;
  RUCK_TRACKING=false;
  var elapsed=Date.now()-RUCK_START_TIME;
  var mins=Math.floor(elapsed/60000);
  var secs=Math.floor((elapsed%60000)/1000);
  var timeStr=mins+":"+(secs<10?"0":"")+secs;
  // Auto-save to session
  var data=getSessionData(W,DAY)||{};
  data.ruck=data.ruck||{};
  data.ruck.done="done";
  data.ruck.dist=RUCK_LIVE_DIST.toFixed(2);
  data.ruck.time=timeStr;
  data.ruck.gps=true;
  saveSessionData(W,DAY,data);
  markDirty("workout");paint();
}

function buildWeekSummaryForAI(w){
  // Gather real week data to send to Claude
  var sched=getWeekSchedule(w);
  var dayNames=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  var workouts=[],rucks=[];
  var totalVol=0;
  for(var d=0;d<7;d++){
    var data=getSessionData(w,d);
    if(!data) continue;
    if(sched[d]==="workout"&&sessionHasWorkoutData(w,d)){
      var mode=data.wmode||"full";
      workouts.push(dayNames[d]+" ("+mode+")");
      totalVol+=getWeekVolume?getWeekVolume(w):0;
    }
    if(sched[d]==="ruck"&&data.ruck&&data.ruck.done==="done"){
      var dist=data.ruck.dist||"?";
      var time=data.ruck.time||"?";
      rucks.push(dayNames[d]+" "+dist+"mi in "+time);
    }
  }
  var pts=getWeekPoints(w);
  var bwRaw=localStorage.getItem("bw_w"+w);
  var bwObj=bwRaw?JSON.parse(bwRaw)||{}:{};
  var weights=Object.values(bwObj).filter(function(v){return v;});
  var avgWt=weights.length?Math.round(weights.reduce(function(a,b){return parseFloat(a)+parseFloat(b);},0)/weights.length*10)/10:null;
  var review=localStorage.getItem("review_w"+w)||"not submitted";
  var p=prog(w);
  return{
    week:w,phase:p.ph,points:pts,
    workouts:workouts,rucks:rucks,
    avgWeight:avgWt,review:review,
    calTarget:getCalTarget(),
    notes:(function(){
      var ns=[];
      for(var d=0;d<7;d++){
        var nd=getSessionData(w,d);
        if(nd&&nd.note&&nd.note.trim()) ns.push(dayNames[d]+": "+nd.note.trim());
      }
      return ns;
    })()
  };
}

  if(t.id==="ai-save-btn"&&AI_RESULT){
    saveWorkout({id:Date.now(),name:autoWorkoutName(),date:FDATE,week:W,
      equipment:AI_EQUIPMENT.slice(),intensity:AI_INTENSITY,travel:AI_TRAVEL,recovery:AI_RECOVERY,content:AI_RESULT});
    t.textContent="Saved!";t.style.background="#6b6b6b";
    setTimeout(function(){markDirty("ai");paint();},1200);return;
  }
  if(t.dataset&&t.dataset.runWorkout){
    var wid=parseInt(t.dataset.runWorkout);
    var ws=getSavedWorkouts().find(function(w){return w.id===wid;});
    if(ws){
      AI_RESULT=ws.content;AI_EQUIPMENT=ws.equipment;AI_INTENSITY=ws.intensity;
      AI_TRAVEL=ws.travel||false;AI_RECOVERY=ws.recovery||false;AI_WORKOUT_ID=ws.id;
      var parsedRun=parseAIWorkout(ws.content);
      if(parsedRun){AI_WORKOUT_DATA=parsedRun;AI_STATE="tracking";}
      else{AI_WORKOUT_DATA=null;AI_STATE="result";}
      markDirty("ai");paint();
    }
    return;
  }
  if(t.dataset&&t.dataset.delWorkout){
    deleteWorkout(parseInt(t.dataset.delWorkout));markDirty("ai");paint();return;
  }
  if(t.id==="recovery-btn"){
    AI_RECOVERY=true;
    AI_TRAVEL=false;
    AI_STATE="idle";
    AI_RESULT="";
    AI_EQUIPMENT=["Bodyweight","Resistance bands"];
    AI_INTENSITY="easy";
    setTab("ai");return;
  }
  if(t.id==="notes-toggle"){NOTES_OPEN=!NOTES_OPEN;markDirty("workout");paint();return;}
  if(t.id==="note-save-btn"){
    var noteEl=document.getElementById("session-note");
    if(noteEl){
      var data=getSessionData(W,DAY)||{};
      data.note=noteEl.value;
      saveSessionData(W,DAY,data);
      var chip=document.getElementById("saved-chip");
      if(chip){chip.textContent="Note saved!";chip.style.opacity="1";
               setTimeout(function(){chip.style.opacity="0";},1500);}
    }
    return;
  }
  if(t.id==="ruck-start-btn"){startRuckTracking();return;}
  if(t.id==="ruck-stop-btn"){stopRuckTracking();return;}
  if(t.id==="travel-btn"){
    AI_TRAVEL=true;
    AI_STATE="idle";
    AI_RESULT="";
    AI_EQUIPMENT=["Bodyweight"];
    AI_INTENSITY="moderate";
    setTab("ai");return;
  }
  if(t.id==="travel-exit"){
    AI_TRAVEL=false;
    AI_EQUIPMENT=[];
    markDirty("ai");paint();return;
  }
  if(t.id==="recovery-exit"){
    AI_RECOVERY=false;
    AI_EQUIPMENT=[];
    AI_INTENSITY="moderate";
    markDirty("ai");paint();return;
  }
  if(t.id==="rearrange-btn"){SCHED_EDIT=true;markDirty("workout");paint();return;}
  if(t.id==="welcome-dismiss"){WELCOME_DISMISSED=true;markDirty("workout");paint();return;}

  if(t.dataset&&t.dataset.checkin){
    CHECKIN_ENERGY=t.dataset.checkin;
    CHECKIN_DONE=true;
    if(t.dataset.checkin==="ready"){WORKOUT_MODE="full";}
    else if(t.dataset.checkin==="low"){WORKOUT_MODE="minimum";}
    else{AI_RECOVERY=true;AI_TRAVEL=false;AI_STATE="idle";AI_RESULT="";
         AI_EQUIPMENT=["Bodyweight","Resistance bands"];AI_INTENSITY="easy";
         markDirty("workout");setTab("ai");return;}
    markDirty("workout");paint();return;
  }
  if(t.dataset&&t.dataset.setmode){setModeAndRefresh(t.dataset.setmode);return;}
  if(t.dataset&&t.dataset.timelimit!==undefined){
    TIME_LIMIT=parseInt(t.dataset.timelimit);markDirty("workout");paint();return;
  }
  if(t.id==="mode-keep-going"){setModeAndRefresh("scaled");return;}
  if(t.id==="mode-thats-enough"){setModeAndRefresh("minimum");return;}
  if(t.id==="mode-go-full"){
    setModeAndRefresh("full");
    var chip=document.getElementById("saved-chip");
    if(chip){chip.textContent="Full session! &#128170;";chip.style.opacity="1";
             setTimeout(function(){chip.style.opacity="0";},2000);}
    return;
  }
  if(t.id==="share-week-btn"){
    var sum=buildWeekSummaryForAI(W);
    var txt="🔥 Train & Fuel — Week "+sum.week+" Summary\n"
      +"Phase "+sum.phase+" | "+sum.points+"/6 pts\n"
      +"Workouts: "+(sum.workouts.length>0?sum.workouts.join(", "):"none")+"\n"
      +"Rucks: "+(sum.rucks.length>0?sum.rucks.join(", "):"none")+"\n"
      +(sum.avgWeight?"Avg weight: "+sum.avgWeight+"lb\n":"")
      +"Week review: "+sum.review+"\n"
      +"#TrainAndFuel #Rucking #Recomp";
    if(navigator.share){
      navigator.share({title:"Week "+W+" Summary",text:txt});
    } else {
      navigator.clipboard.writeText(txt).then(function(){
        var chip=document.getElementById("saved-chip");
        if(chip){chip.textContent="Copied to clipboard!";chip.style.opacity="1";
                 setTimeout(function(){chip.style.opacity="0";},2000);}
      });
    }
    return;
  }
  if(t.id==="debrief-btn"){generateWeeklyDebrief();return;}
  if(t.id==="debrief-reset"){DEBRIEF_STATE="idle";DEBRIEF_RESULT="";markDirty("workout");paint();return;}
  if(t.dataset&&t.dataset.review){
    localStorage.setItem("review_w"+W,t.dataset.review);
    WEEK_REVIEW_DONE=true;markDirty("workout");paint();return;
  }
  if(t.id==="week-advance-yes"){advanceProgramWeek();W=calcCurrentWeekGated();
    FDATE=getDateForDay(W,DAY);CHECKIN_DONE=false;markAllDirty();renderDayTabs();paint();return;}
  if(t.id==="week-stay"){localStorage.setItem("tf_prog_week",W);
    CHECKIN_DONE=false;markAllDirty();paint();return;}
  if(t.id==="sched-done"){SCHED_EDIT=false;renderDayTabs();markDirty("workout");paint();return;}
  if(t.id==="ai-track-done"){
    AI_STATE="idle";AI_WORKOUT_DATA=null;markDirty("ai");paint();return;
  }
  if(t.id==="ai-track-text"){
    AI_STATE="result";markDirty("ai");paint();return;
  }
  if(t.dataset&&t.dataset.chk){
    var chkKey=t.dataset.chk+"_done";
    var wasDone=sg(chkKey);
    if(wasDone){ss(chkKey,"");t.style.background="#e8eaed";t.style.color="#6b6b6b";t.innerHTML="&#9711;";}
    else{ss(chkKey,"1");t.style.background="#1a7a44";t.style.color="#fff";t.innerHTML="&#10003;";}
    return;
  }
  if(t.id==="sore-toggle"){SORE_OPEN=!SORE_OPEN;markDirty("workout");paint();return;}
  if(t.dataset&&t.dataset.sore){
    var part=t.dataset.sore;
    var sKey="sore_w"+W+"_d"+DAY;
    var sArr=[];try{sArr=JSON.parse(localStorage.getItem(sKey)||"[]");}catch(e){}
    var idx=sArr.indexOf(part);
    if(idx>=0)sArr.splice(idx,1);else sArr.push(part);
    localStorage.setItem(sKey,JSON.stringify(sArr));
    markDirty("workout");paint();return;
  }
  if(t.id==="sched-reset"){
    localStorage.removeItem("sched_w"+W);
    markDirty("workout");paint();renderDayTabs();return;
  }
  if(t.dataset&&t.dataset.schedDay!==undefined){
    var di=parseInt(t.dataset.schedDay);
    var sc=getWeekSchedule(W);
    var cycle={"workout":"ruck","ruck":"rest","rest":"workout"};
    sc[di]=cycle[sc[di]];
    saveWeekSchedule(sc,W);
    markDirty("workout");paint();return;
  }
  if(t.id==="rn-save"){
    var el=document.getElementById("rn");
    if(el){var d=lg("rn_w"+W)||{};d[DAY_NAMES[DAY]]=el.value;ls("rn_w"+W,d);flash();}
    return;
  }
  if(t.id==="today-btn"){
    W=calcCurrentWeekGated();DAY=defaultDay();
    FDATE=getDateForDay(W,DAY);
    markAllDirty();renderDayTabs();paint();
    setTab("workout");return;
  }
  if(t.dataset&&t.dataset.day!==undefined&&t.classList&&t.classList.contains("dt")){setDay(parseInt(t.dataset.day));return;}
  if(t.dataset&&t.dataset.applyCal&&t.dataset.applyCal!=="0"){var nc=Math.max(1800,Math.min(3000,getCalTarget()+parseInt(t.dataset.applyCal)));setCalTarget(nc);t.textContent="Applied!";return;}
  if(t.dataset&&t.dataset.wk){W=parseInt(t.dataset.wk);FDATE=getDateForDay(W,DAY);document.getElementById("wk-el").textContent=W===0?"T":W;markAllDirty();paint();return;}
  if(t.dataset&&t.dataset.dotCat&&t.dataset.dotIdx!==undefined){toggleDot(t.dataset.dotCat,parseInt(t.dataset.dotIdx));return;}
  if(t.id==="meal-suggest-btn"){
    MEAL_STATE="loading"; markDirty("food"); paint();
    generateMealSuggestion(); return;
  }
  if(t.id==="meal-clear-btn"){
    MEAL_STATE="idle"; MEAL_RESULT=""; markDirty("food"); paint(); return;
  }
  if(t.id==="fd-prev"){FDATE=new Date(new Date(FDATE+"T12:00:00").getTime()-864e5).toISOString().slice(0,10);MEAL_STATE="idle";MEAL_RESULT="";markDirty("food");paint();return;}
  if(t.id==="fd-next"){FDATE=new Date(new Date(FDATE+"T12:00:00").getTime()+864e5).toISOString().slice(0,10);MEAL_STATE="idle";MEAL_RESULT="";markDirty("food");paint();return;}
  if(t.id==="qa-submit"){submitQuickAdd();return;}
  if(t.id==="build-plate-btn"){BUILDING=true;PLATE_CAT=null;PLATE_QTY=1;PLATE_NAME="";markDirty("food");paint();return;}
  if(t.id==="plate-cancel"){BUILDING=false;PLATE_CAT=null;markDirty("food");paint();return;}
  if(t.id==="manual-entry-btn"){openManual();return;}
  if(t.dataset&&t.dataset.plateCat){PLATE_CAT=t.dataset.plateCat;PLATE_NAME="";PLATE_QTY=1;markDirty("food");paint();return;}
  if(t.id==="plate-minus"){PLATE_QTY=Math.max(0.5,+(PLATE_QTY-0.5).toFixed(1));updatePlateCalc();return;}
  if(t.id==="plate-plus"){PLATE_QTY=+(PLATE_QTY+0.5).toFixed(1);updatePlateCalc();return;}
  if(t.id==="hot-log-btn"&&PLATE_CAT){
    var pp=PN[PLATE_CAT],nm=document.getElementById("plate-name");
    var iN=(nm&&nm.value.trim())||(PLATE_QTY+" "+pp.hand+(PLATE_QTY!==1?"s":"")+" "+pp.name);
    var l=getLog();l.push({name:iN,serving:1,cal:Math.round(pp.cal*PLATE_QTY),pro:+(pp.pro*PLATE_QTY).toFixed(1),carb:+(pp.carb*PLATE_QTY).toFixed(1),fat:+(pp.fat*PLATE_QTY).toFixed(1)});
    saveLog(l);var c2=getConsumed();c2[PLATE_CAT]=(c2[PLATE_CAT]||0)+PLATE_QTY;saveConsumed(c2);
    PLATE_CAT=null;PLATE_NAME="";PLATE_QTY=1;markDirty("food");paint();return;
  }
  if(t.dataset&&t.dataset.del!==undefined){var l2=getLog();l2.splice(parseInt(t.dataset.del),1);saveLog(l2);markDirty("food");paint();return;}
  if(t.id==="pending-cancel"){PENDING=null;PENDING_SRV=100;markDirty("food");paint();return;}
  if(t.id==="pending-add"&&PENDING){
    var srvEl=document.getElementById("srv-inp");
    var srv=srvEl?parseFloat(srvEl.value)||100:PENDING_SRV;
    var mult=srv/100;
    var l=getLog();
    l.push({
      name:PENDING.name+(srv!==100?" ("+srv+"g)":""),
      serving:srv,
      cal:Math.round(PENDING.cal100*mult),
      pro:Math.round(PENDING.pro100*mult*10)/10,
      carb:Math.round(PENDING.carb100*mult*10)/10,
      fat:Math.round(PENDING.fat100*mult*10)/10
    });
    saveLog(l);
    PENDING=null;PENDING_SRV=100;
    var el=document.getElementById("food-search");
    if(el){el.value="";}
    var sr=document.getElementById("search-results");
    if(sr){sr.innerHTML="";}
    SRESULTS=[];
    markDirty("food");paint();return;
  }
  if(t.dataset&&t.dataset.result!==undefined&&SRESULTS[parseInt(t.dataset.result)]){PENDING=SRESULTS[parseInt(t.dataset.result)];PENDING_SRV=PENDING.defServing||100;markDirty("food");paint();return;}
  if(t.id==="dark-toggle"){
    DARK_MODE=!DARK_MODE;
    localStorage.setItem("dark_mode",DARK_MODE?"1":"0");
    if(DARK_MODE) document.body.classList.add("dark");
    else document.body.classList.remove("dark");
    markDirty("progress");paint();return;
  }
  if(t.id==="photo-btn"){
    var inp=document.getElementById("photo-input");
    if(inp){inp.onchange=function(e){
      var file=e.target.files[0];
      if(!file) return;
      var reader=new FileReader();
      reader.onload=function(ev){
        var photos=[];
        try{photos=JSON.parse(localStorage.getItem("progress_photos")||"[]");}catch(e){}
        photos.push({date:FDATE,week:W,data:ev.target.result});
        if(photos.length>20) photos=photos.slice(-20); // keep last 20
        localStorage.setItem("progress_photos",JSON.stringify(photos));
        var chip=document.getElementById("saved-chip");
        if(chip){chip.textContent="Photo saved!";chip.style.opacity="1";
                 setTimeout(function(){chip.style.opacity="0";},2000);}
        markDirty("progress");paint();
      };
      reader.readAsDataURL(file);
    };inp.click();}
    return;
  }
  if(t.id==="repeat-week-btn"){
    // Mark all this week's sessions as intentionally repeated
    // Just reset dismissed state and show a confirmation
    WELCOME_DISMISSED=false;
    localStorage.setItem("repeat_w"+W,"1");
    markAllDirty();paint();
    setTab("workout");return;
  }
  if(t.id==="api-toggle"){
    API_SETTINGS_OPEN=!API_SETTINGS_OPEN;markDirty("progress");paint();return;
  }
  if(t.id==="api-key-save"){
    var k=document.getElementById("api-key-inp");
    if(k){setApiKey(k.value.trim());flash();markDirty("progress");paint();}
    return;
  }
  if(t.id==="go-settings-btn"){setTab("progress");return;}
  if(t.id==="hand-save-btn"){localStorage.setItem("tf_hand",JSON.stringify({palm:parseFloat(document.getElementById("hs-palm").value)||85,fist:parseFloat(document.getElementById("hs-fist").value)||130,cupped:parseFloat(document.getElementById("hs-cupped").value)||45,thumb:parseFloat(document.getElementById("hs-thumb").value)||14}));flash();return;}
  if(t.dataset&&t.dataset.delMeas!==undefined){
    var md=[];try{md=JSON.parse(localStorage.getItem("tf_measurements")||"[]");}catch(e){}
    md.splice(parseInt(t.dataset.delMeas),1);
    localStorage.setItem("tf_measurements",JSON.stringify(md));
    markDirty("goals");paint();return;
  }
  if(t.id==="wt-save-btn"){
    var sw=parseFloat(document.getElementById("sw-inp").value);
    var gw=parseFloat(document.getElementById("gw-inp").value);
    if(sw) localStorage.setItem("tf_start_weight",sw);
    if(gw) localStorage.setItem("tf_goal_weight",gw);
    markDirty("goals");paint();flash();return;
  }
  if(t.id==="ms-save-btn"){
    var md=[];try{md=JSON.parse(localStorage.getItem("tf_measurements")||"[]");}catch(e){}
    md.push({date:FDATE||todayStr(),weight:parseFloat(document.getElementById("ms-weight").value)||null,chest:document.getElementById("ms-chest").value||"",waist:document.getElementById("ms-waist").value||"",rightArm:document.getElementById("ms-arm").value||"",neck:document.getElementById("ms-neck").value||"",note:document.getElementById("ms-note").value||""});
    localStorage.setItem("tf_measurements",JSON.stringify(md));markAllDirty();paint();return;
  }
});

document.addEventListener("input",function(e){
  var t=e.target;
  if(t.id==="qa-name"){QA_NAME=t.value;return;}
  if(t.id==="qa-cal"){QA_CAL=t.value;return;}
  if(t.id==="qa-pro"){QA_PRO=t.value;return;}
  if(t.id==="qa-carb"){QA_CARB=t.value;return;}
  if(t.id==="qa-fat"){QA_FAT=t.value;return;}
  if(t.id==="food-search"){updateSearchResults(t.value);return;}
  if(t.id==="ms-weight"||t.id==="ms-chest"||t.id==="ms-waist"||t.id==="ms-arm"||t.id==="ms-neck"||t.id==="ms-note"){return;}
  if(t.id==="ov-name"||t.id==="ov-cal"||t.id==="ov-p"||t.id==="ov-c"||t.id==="ov-f"){return;}
  if(t.id==="plate-name"){PLATE_NAME=t.value;return;}
  if(t.classList&&t.classList.contains("si")&&t.dataset.key){ss(t.dataset.key,t.value);}
  if(t.classList&&t.classList.contains("ti")&&t.dataset.key){ss(t.dataset.key,t.value);}
  if(t.classList&&t.classList.contains("ni")&&t.dataset.key){ss(t.dataset.key,t.value);}
  // AI workout set/weight inputs
  if(t.dataset&&t.dataset.aiSet){
    var aiParts=t.dataset.aiSet.split(".");
    var aiExKey=aiParts.slice(0,aiParts.length-1).join(".");
    var aiSetNum=aiParts[aiParts.length-1];
    var aiSd=getSessionData(W,DAY)||{};
    if(!aiSd[aiExKey])aiSd[aiExKey]={};
    aiSd[aiExKey][aiSetNum]=t.value;
    saveSessionData(W,DAY,aiSd);return;
  }
  if(t.dataset&&t.dataset.aiWt){
    var aiSd2=getSessionData(W,DAY)||{};
    if(!aiSd2[t.dataset.aiWt])aiSd2[t.dataset.aiWt]={};
    aiSd2[t.dataset.aiWt].wt=t.value;
    saveSessionData(W,DAY,aiSd2);return;
  }
  // Catch-all: any input with data-key not handled above
  if(t.dataset&&t.dataset.key&&!t.classList.contains("bw-inp")){ss(t.dataset.key,t.value);}
  if(t.classList&&t.classList.contains("bw-inp")&&t.dataset.day){var o=lg("bw_w"+W)||{};o[t.dataset.day]=parseFloat(t.value)||null;ls("bw_w"+W,o);flash();}
});

document.addEventListener("change",function(e){
  var t=e.target;
  if(t.tagName==="SELECT"&&t.dataset.key){ss(t.dataset.key,t.value);markDirty("workout");paint();return;}
  if(t.classList&&t.classList.contains("ni")&&t.dataset.key){ss(t.dataset.key,t.value);}
  if(t.classList&&t.classList.contains("ti")&&t.dataset.key){ss(t.dataset.key,t.value);}
});

// Save active text field when app goes to background or field loses focus
function saveActiveField(){
  var a=document.activeElement;
  if(a&&a.dataset&&a.dataset.key){
    if(a.classList&&(a.classList.contains("ni")||a.classList.contains("ti"))){
      ss(a.dataset.key,a.value);
    }
  }
}
document.addEventListener("visibilitychange",function(){if(document.hidden)saveActiveField();});
document.addEventListener("blur",function(){saveActiveField();},true);

// INIT
(function(){if(localStorage.getItem("dark_mode")==="1")document.body.classList.add("dark");})();
document.getElementById("wk-el").textContent=W===0?"T":W;
renderDayTabs();
document.getElementById("panel-workout").innerHTML=bWorkoutPanel();
DIRTY.workout=false;
</script>
</body>
